<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up - Glovbox</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Inter',sans-serif;background:linear-gradient(135deg,#0B3D91 0%,#1e5cb8 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.container{max-width:420px;width:100%}.card{background:white;border-radius:16px;padding:40px;box-shadow:0 8px 32px rgba(0,0,0,0.1)}.logo{text-align:center;margin-bottom:28px}.logo h1{color:#0B3D91;font-size:32px;font-weight:700}.form-group{margin-bottom:18px}label{display:block;color:#1E293B;font-weight:600;margin-bottom:6px;font-size:14px}input{width:100%;padding:13px 14px;border:2px solid #E2E8F0;border-radius:8px;font-size:15px;font-family:inherit;transition:border-color 0.2s}input:focus{outline:none;border-color:#0B3D91}.btn{width:100%;background:#FF6B35;color:white;padding:15px;border-radius:8px;border:none;font-weight:700;font-size:16px;cursor:pointer;transition:background 0.2s}.btn:hover{background:#E85A2A}.btn:disabled{background:#CBD5E1;cursor:not-allowed}.btn-outline{width:100%;background:white;color:#0B3D91;padding:13px;border-radius:8px;border:2px solid #0B3D91;font-weight:700;font-size:14px;cursor:pointer;margin-top:10px;transition:all 0.2s}.btn-outline:hover{background:#EFF6FF}.btn-outline:disabled{border-color:#CBD5E1;color:#94A3B8;cursor:not-allowed}.error{background:#FEF2F2;color:#DC2626;padding:12px 14px;border-radius:8px;margin-bottom:16px;border:1px solid #FEE2E2;display:none;font-size:14px}.links{text-align:center;margin-top:20px;font-size:14px}.links a{color:#0B3D91;text-decoration:none;font-weight:600}.links a:hover{text-decoration:underline}.divider{text-align:center;margin:16px 0;color:#94A3B8;font-size:14px}#confirmScreen{display:none;text-align:center}.email-icon{font-size:64px;margin-bottom:16px}#confirmScreen h2{color:#0B3D91;font-size:22px;margin-bottom:10px}#confirmScreen p{color:#64748B;font-size:14px;line-height:1.6;margin-bottom:6px}.email-highlight{background:#F0FDF4;border:1px solid #BBF7D0;border-radius:8px;padding:12px 16px;color:#15803D;font-weight:600;font-size:15px;margin:16px 0;word-break:break-all}.resend-section{margin-top:22px;padding-top:18px;border-top:1px solid #E2E8F0}.resend-section p{color:#94A3B8;font-size:13px;margin-bottom:10px}#resendMsg{font-size:13px;margin-top:8px;display:none;padding:8px;border-radius:6px}
</style>
</head>
<body>
<div class="container"><div class="card">

<div id="signupScreen">
<div class="logo"><h1>Glovbox</h1><p style="color:#64748B;font-size:14px;margin-top:8px">Create your free account</p></div>
<div id="error" class="error"></div>
<div class="form-group"><label for="name">Full Name</label><input type="text" id="name" placeholder="e.g. John Smith" required autocomplete="name"></div>
<div class="form-group"><label for="email">Email Address</label><input type="email" id="email" placeholder="you@example.com" required autocomplete="email"></div>
<div class="form-group"><label for="password">Password</label><input type="password" id="password" required autocomplete="new-password" minlength="8" placeholder="Minimum 8 characters"></div>
<button class="btn" id="submitBtn" onclick="submitSignup()">Create Account</button>
<div class="divider">Already have an account?</div>
<div class="links"><a href="/signin.html">Sign in →</a></div>
</div>

<div id="confirmScreen">
<div class="email-icon">📧</div>
<h2>Check your inbox!</h2>
<p>We've sent a verification link to:</p>
<div class="email-highlight" id="confirmedEmail"></div>
<p>Click the link in the email to activate your account. It expires in <strong>24 hours</strong>.</p>
<p style="margin-top:10px;color:#94A3B8;font-size:13px">Can't find it? Check your spam or junk folder.</p>
<div class="resend-section">
<p>Didn't receive it?</p>
<button class="btn-outline" id="resendBtn" onclick="resendVerification()">Resend Verification Email</button>
<div id="resendMsg"></div>
</div>
<div class="divider" style="margin-top:22px"></div>
<div class="links"><a href="/signin.html">← Back to Sign In</a></div>
</div>

</div></div>

<script>
let signupEmail = '';

async function submitSignup() {
  const name = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const errorDiv = document.getElementById('error');
  const submitBtn = document.getElementById('submitBtn');
  errorDiv.style.display = 'none';
  if (!name || !email || !password) { errorDiv.textContent = 'Please fill in all fields.'; errorDiv.style.display = 'block'; return; }
  if (password.length < 8) { errorDiv.textContent = 'Password must be at least 8 characters.'; errorDiv.style.display = 'block'; return; }
  submitBtn.disabled = true; submitBtn.textContent = 'Creating account...';
  try {
    const response = await fetch('/api/signup', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({name, email, password}) });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || 'Sign up failed');
    signupEmail = email;
    document.getElementById('signupScreen').style.display = 'none';
    document.getElementById('confirmedEmail').textContent = email;
    document.getElementById('confirmScreen').style.display = 'block';
  } catch (error) {
    submitBtn.disabled = false; submitBtn.textContent = 'Create Account';
    errorDiv.textContent = '❌ ' + error.message; errorDiv.style.display = 'block';
  }
}

async function resendVerification() {
  const btn = document.getElementById('resendBtn');
  const msg = document.getElementById('resendMsg');
  btn.disabled = true; btn.textContent = 'Sending...'; msg.style.display = 'none';
  try {
    const response = await fetch('/api/resend-verification', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({email: signupEmail}) });
    const data = await response.json();
    if (response.ok) { msg.textContent = '✅ Resent! Check your inbox (and spam folder).'; msg.style.background = '#F0FDF4'; msg.style.color = '#15803D'; }
    else { msg.textContent = '❌ ' + (data.error || 'Could not resend.'); msg.style.background = '#FEF2F2'; msg.style.color = '#DC2626'; }
    msg.style.display = 'block';
    setTimeout(() => { btn.disabled = false; btn.textContent = 'Resend Verification Email'; }, 30000);
  } catch(e) {
    msg.textContent = '❌ Error. Please try again.'; msg.style.background = '#FEF2F2'; msg.style.color = '#DC2626'; msg.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Resend Verification Email';
  }
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && document.getElementById('signupScreen').style.display !== 'none') submitSignup();
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up - Glovbox</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">

<div class="min-h-screen flex items-center justify-center px-4 py-12">
  <div class="max-w-md w-full">
    <div class="text-center mb-8">
      <h1 class="text-4xl font-bold text-blue-900 mb-2">🚗 Glovbox</h1>
      <h2 class="text-2xl font-bold text-gray-900">Create Account</h2>
    </div>

    <!-- Signup Form -->
    <div id="signupForm" class="bg-white rounded-2xl shadow-lg p-8">
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Name</label>
          <input
            type="text"
            id="name"
            placeholder="John Doe"
            class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-blue-500 focus:outline-none"
          />
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Email</label>
          <input
            type="email"
            id="email"
            placeholder="you@example.com"
            class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-blue-500 focus:outline-none"
          />
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Password</label>
          <input
            type="password"
            id="password"
            placeholder="At least 8 characters"
            class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-blue-500 focus:outline-none"
          />
        </div>

        <p id="error" class="text-red-600 text-sm hidden"></p>

        <button
          onclick="signUp()"
          id="signUpBtn"
          class="w-full bg-orange-500 text-white py-3 rounded-lg font-bold hover:bg-orange-600"
        >
          Create Account
        </button>

        <p class="text-center text-gray-600 text-sm">
          Already have an account? 
          <a href="/signin.html" class="text-blue-600 hover:underline font-semibold">Sign In</a>
        </p>
      </div>
    </div>

    <!-- Success Message -->
    <div id="successMessage" class="hidden bg-white rounded-2xl shadow-lg p-8 text-center">
      <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
        <svg class="w-8 h-8 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
        </svg>
      </div>
      <h3 class="text-2xl font-bold text-gray-900 mb-2">Check Your Email!</h3>
      <p class="text-gray-600 mb-4">We've sent a verification link to:</p>
      <p id="sentEmail" class="text-blue-600 font-semibold mb-6"></p>
      <p class="text-sm text-gray-500">Click the link in the email to activate your account.</p>
    </div>
  </div>
</div>

<script>
async function signUp() {
  const name = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const errorEl = document.getElementById('error');
  const btn = document.getElementById('signUpBtn');

  errorEl.classList.add('hidden');

  if (!name || !email || !password) {
    errorEl.textContent = 'Please fill all fields';
    errorEl.classList.remove('hidden');
    return;
  }

  if (password.length < 8) {
    errorEl.textContent = 'Password must be at least 8 characters';
    errorEl.classList.remove('hidden');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Creating account...';

  try {
    const response = await fetch('/api/signup', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({name, email, password})
    });

    const data = await response.json();

    if (response.ok) {
      document.getElementById('signupForm').classList.add('hidden');
      document.getElementById('successMessage').classList.remove('hidden');
      document.getElementById('sentEmail').textContent = email;
    } else {
      errorEl.textContent = data.error || 'Signup failed';
      errorEl.classList.remove('hidden');
    }
  } catch (error) {
    errorEl.textContent = 'Network error. Please try again.';
    errorEl.classList.remove('hidden');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Create Account';
  }
}
</script>

</body>
</html>

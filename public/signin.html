<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In - Glovbox</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">

<div class="min-h-screen flex items-center justify-center px-4">
  <div class="max-w-md w-full">
    <div class="text-center mb-8">
      <h1 class="text-4xl font-bold text-blue-900 mb-2">🚗 Glovbox</h1>
      <h2 class="text-2xl font-bold text-gray-900">Welcome Back</h2>
    </div>

    <div class="bg-white rounded-2xl shadow-lg p-8">
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Email</label>
          <input
            type="email"
            id="email"
            placeholder="you@example.com"
            class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-blue-500 focus:outline-none"
          />
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Password</label>
          <input
            type="password"
            id="password"
            placeholder="••••••••"
            class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-blue-500 focus:outline-none"
            onkeypress="if(event.key==='Enter') signIn()"
          />
        </div>

        <p id="error" class="text-red-600 text-sm hidden"></p>
        <p id="verifyMessage" class="text-orange-600 text-sm hidden"></p>

        <button
          onclick="signIn()"
          id="signInBtn"
          class="w-full bg-orange-500 text-white py-3 rounded-lg font-bold hover:bg-orange-600"
        >
          Sign In
        </button>

        <div class="text-center space-y-2">
          <a href="/forgot-password.html" class="block text-blue-600 hover:underline text-sm">
            Forgot Password?
          </a>
          <p class="text-gray-600 text-sm">
            Don't have an account? 
            <a href="/signup.html" class="text-blue-600 hover:underline font-semibold">Sign Up</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
async function signIn() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const errorEl = document.getElementById('error');
  const verifyEl = document.getElementById('verifyMessage');
  const btn = document.getElementById('signInBtn');

  errorEl.classList.add('hidden');
  verifyEl.classList.add('hidden');

  if (!email || !password) {
    errorEl.textContent = 'Please enter email and password';
    errorEl.classList.remove('hidden');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Signing in...';

  try {
    const response = await fetch('/api/signin', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({email, password})
    });

    const data = await response.json();

    if (response.ok) {
      sessionStorage.setItem('glovbox_token', data.token);
      sessionStorage.setItem('glovbox_user', JSON.stringify(data.user));
      window.location.href = '/dashboard.html';
    } else {
      if (data.needsVerification) {
        verifyEl.innerHTML = data.message + ' <a href="/verify-email.html" class="underline">Resend verification</a>';
        verifyEl.classList.remove('hidden');
      } else {
        errorEl.textContent = data.error || 'Sign in failed';
        errorEl.classList.remove('hidden');
      }
    }
  } catch (error) {
    errorEl.textContent = 'Network error. Please try again.';
    errorEl.classList.remove('hidden');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Sign In';
  }
}
</script>

</body>
</html>

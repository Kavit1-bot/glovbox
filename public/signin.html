<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In - Glovbox</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}:root{--blue:#0B3D91;--orange:#FF6B35;--green:#10B981;--bg:#F8FAFC;--white:#FFF;--border:#E2E8F0;--text:#1E293B;--red:#EF4444}body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.container{max-width:450px;width:100%}.logo{text-align:center;margin-bottom:32px}.logo a{font-size:28px;font-weight:700;color:var(--blue);text-decoration:none}.card{background:var(--white);border:1px solid var(--border);border-radius:16px;padding:40px;box-shadow:0 4px 16px rgba(11,61,145,0.08)}.tabs{display:flex;gap:16px;margin-bottom:32px;border-bottom:2px solid var(--border)}.tab{flex:1;padding:12px;border:none;background:none;font-size:16px;font-weight:600;color:#64748B;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all 0.2s}.tab.active{color:var(--blue);border-bottom-color:var(--blue)}.form-group{margin-bottom:20px}label{display:block;font-weight:600;margin-bottom:8px;font-size:14px;color:var(--text)}input{width:100%;padding:14px;border:2px solid var(--border);border-radius:8px;font-size:15px;font-family:'Inter',sans-serif;transition:border-color 0.2s}input:focus{outline:none;border-color:var(--blue)}input.error{border-color:var(--red)}.error-msg{color:var(--red);font-size:13px;margin-top:6px;display:none}.error-msg.show{display:block}.password-hint{font-size:12px;color:#64748B;margin-top:4px}.btn{width:100%;background:var(--orange);color:white;padding:16px;border-radius:8px;border:none;font-weight:700;font-size:16px;cursor:pointer;transition:all 0.2s}.btn:hover{background:#E85A2A}.btn:disabled{background:#94A3B8;cursor:not-allowed}.divider{text-align:center;margin:24px 0;color:#64748B;font-size:14px}.alert{padding:12px 16px;border-radius:8px;margin-bottom:20px;font-size:14px;display:none}.alert.show{display:block}.alert-error{background:#FEE2E2;color:#991B1B;border:1px solid #FCA5A5}.alert-success{background:#D1FAE5;color:#065F46;border:1px solid #6EE7B7}@media (max-width:480px){.card{padding:28px 24px}}
</style>
</head>
<body>
<div class="container">
<div class="logo"><a href="/">Glovbox</a></div>
<div class="card">
<div class="tabs">
<button class="tab active" onclick="showTab('signup')">Sign Up</button>
<button class="tab" onclick="showTab('signin')">Sign In</button>
</div>

<div class="alert alert-error" id="errorAlert"></div>
<div class="alert alert-success" id="successAlert"></div>

<form id="signupForm" style="display:block;">
<div class="form-group">
<label>Full Name</label>
<input type="text" id="signupName" placeholder="John Smith" required>
<div class="error-msg" id="nameError">Name is required</div>
</div>
<div class="form-group">
<label>Email</label>
<input type="email" id="signupEmail" placeholder="you@example.com" required>
<div class="error-msg" id="emailError">Valid email required</div>
</div>
<div class="form-group">
<label>Password</label>
<input type="password" id="signupPassword" placeholder="Min 8 characters" required minlength="8">
<div class="password-hint">At least 8 characters</div>
<div class="error-msg" id="passwordError">Password must be at least 8 characters</div>
</div>
<button type="submit" class="btn" id="signupBtn">Create Free Account</button>
<div class="divider">100% free forever • No credit card required</div>
</form>

<form id="signinForm" style="display:none;">
<div class="form-group">
<label>Email</label>
<input type="email" id="signinEmail" placeholder="you@example.com" required>
</div>
<div class="form-group">
<label>Password</label>
<input type="password" id="signinPassword" placeholder="Your password" required>
</div>
<button type="submit" class="btn" id="signinBtn">Sign In</button>
</form>
</div>
</div>

<script>
// Check if already logged in
const token = localStorage.getItem('glovbox_token');
if (token) {
  window.location.href = '/dashboard.html';
}

function showTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  
  if (tab === 'signup') {
    document.getElementById('signupForm').style.display = 'block';
    document.getElementById('signinForm').style.display = 'none';
  } else {
    document.getElementById('signupForm').style.display = 'none';
    document.getElementById('signinForm').style.display = 'block';
  }
  
  hideAlerts();
}

function showError(message) {
  const alert = document.getElementById('errorAlert');
  alert.textContent = message;
  alert.classList.add('show');
  document.getElementById('successAlert').classList.remove('show');
}

function showSuccess(message) {
  const alert = document.getElementById('successAlert');
  alert.textContent = message;
  alert.classList.add('show');
  document.getElementById('errorAlert').classList.remove('show');
}

function hideAlerts() {
  document.getElementById('errorAlert').classList.remove('show');
  document.getElementById('successAlert').classList.remove('show');
}

// Sign Up Form
document.getElementById('signupForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  hideAlerts();
  
  const name = document.getElementById('signupName').value.trim();
  const email = document.getElementById('signupEmail').value.trim();
  const password = document.getElementById('signupPassword').value;
  
  if (!name) {
    showError('Please enter your name');
    return;
  }
  
  if (!email || !email.includes('@')) {
    showError('Please enter a valid email address');
    return;
  }
  
  if (password.length < 8) {
    showError('Password must be at least 8 characters');
    return;
  }
  
  const btn = document.getElementById('signupBtn');
  btn.disabled = true;
  btn.textContent = 'Creating account...';
  
  try {
    const response = await fetch('/api/signup', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({name, email, password})
    });
    
    const data = await response.json();
    
    if (!response.ok) {
      showError(data.error || 'Failed to create account');
      btn.disabled = false;
      btn.textContent = 'Create Free Account';
      return;
    }
    
    // Success - Save and redirect to dashboard
    localStorage.setItem('glovbox_token', data.token);
    localStorage.setItem('glovbox_user', JSON.stringify(data.user));
    
    showSuccess('Account created! Redirecting to dashboard...');
    setTimeout(() => {
      window.location.href = '/dashboard.html';
    }, 1000);
    
  } catch (error) {
    showError('Network error. Please check your connection.');
    btn.disabled = false;
    btn.textContent = 'Create Free Account';
  }
});

// Sign In Form
document.getElementById('signinForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  hideAlerts();
  
  const email = document.getElementById('signinEmail').value.trim();
  const password = document.getElementById('signinPassword').value;
  
  if (!email || !password) {
    showError('Please enter email and password');
    return;
  }
  
  const btn = document.getElementById('signinBtn');
  btn.disabled = true;
  btn.textContent = 'Signing in...';
  
  try {
    const response = await fetch('/api/signin', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({email, password})
    });
    
    const data = await response.json();
    
    if (!response.ok) {
      showError(data.error || 'Invalid email or password');
      btn.disabled = false;
      btn.textContent = 'Sign In';
      return;
    }
    
    // Success - Save and redirect to dashboard
    localStorage.setItem('glovbox_token', data.token);
    localStorage.setItem('glovbox_user', JSON.stringify(data.user));
    
    showSuccess('Signed in! Redirecting to dashboard...');
    setTimeout(() => {
      window.location.href = '/dashboard.html';
    }, 1000);
    
  } catch (error) {
    showError('Network error. Please check your connection.');
    btn.disabled = false;
    btn.textContent = 'Sign In';
  }
});
</script>
</body>
</html>

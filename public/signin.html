<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Glovbox</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --blue: #0B3D91;
            --orange: #FF6B35;
            --bg: #F8FAFC;
            --white: #FFFFFF;
            --border: #E2E8F0;
            --text: #1E293B;
        }
        body { font-family: 'Inter', sans-serif; background: var(--bg); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .container { max-width: 450px; width: 100%; }
        .logo { text-align: center; margin-bottom: 40px; }
        .logo a { font-size: 32px; font-weight: 700; color: var(--blue); text-decoration: none; }
        .card { background: var(--white); border: 1px solid var(--border); border-radius: 16px; padding: 48px; box-shadow: 0 4px 16px rgba(11,61,145,0.08); }
        .tabs { display: flex; gap: 16px; margin-bottom: 32px; border-bottom: 2px solid var(--border); }
        .tab { flex: 1; padding: 12px; text-align: center; font-weight: 600; color: var(--text); cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px; }
        .tab.active { color: var(--blue); border-bottom-color: var(--blue); }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 14px; }
        input { width: 100%; padding: 14px; border: 2px solid var(--border); border-radius: 8px; font-size: 15px; font-family: 'Inter', sans-serif; }
        input:focus { outline: none; border-color: var(--blue); }
        .btn { width: 100%; background: var(--orange); color: white; padding: 16px; border-radius: 8px; border: none; font-weight: 700; font-size: 16px; cursor: pointer; margin-top: 8px; }
        .btn:hover { background: #E85A2A; }
        .btn:disabled { background: #94A3B8; cursor: not-allowed; }
        .error { background: #FEE2E2; border: 1px solid #EF4444; color: #991B1B; padding: 12px; border-radius: 8px; margin-bottom: 20px; font-size: 14px; display: none; }
        .success { background: #D1FAE5; border: 1px solid #10B981; color: #065F46; padding: 12px; border-radius: 8px; margin-bottom: 20px; font-size: 14px; display: none; }
        .divider { text-align: center; margin: 24px 0; color: #64748B; font-size: 14px; }
        .link { text-align: center; margin-top: 24px; color: #64748B; font-size: 14px; }
        .link a { color: var(--blue); text-decoration: none; font-weight: 600; }
        .features { margin-top: 32px; padding-top: 32px; border-top: 1px solid var(--border); }
        .feature-item { display: flex; align-items: start; gap: 12px; margin-bottom: 16px; font-size: 14px; color: var(--text); }
        #signupForm { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <a href="/">Glovbox</a>
        </div>

        <div class="card">
            <div class="tabs">
                <div class="tab active" onclick="showTab('signin')">Sign In</div>
                <div class="tab" onclick="showTab('signup')">Sign Up</div>
            </div>

            <div id="errorMsg" class="error"></div>
            <div id="successMsg" class="success"></div>

            <!-- SIGN IN FORM -->
            <form id="signinForm">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="signinEmail" required placeholder="you@example.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="signinPassword" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn">Sign In</button>
                <div class="link">
                    <a href="#">Forgot password?</a>
                </div>
            </form>

            <!-- SIGN UP FORM -->
            <form id="signupForm">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="signupName" required placeholder="John Smith">
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="signupEmail" required placeholder="you@example.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="signupPassword" required placeholder="At least 8 characters">
                </div>
                <button type="submit" class="btn">Create Account</button>
                <div class="link" style="margin-top: 16px; font-size: 12px;">
                    By signing up, you agree to our <a href="/terms.html">Terms</a> and <a href="/privacy.html">Privacy Policy</a>
                </div>
            </form>

            <div class="features">
                <div class="feature-item">
                    <span>✓</span>
                    <span><strong>30-day free trial</strong> - No credit card required</span>
                </div>
                <div class="feature-item">
                    <span>✓</span>
                    <span><strong>Automated reminders</strong> - Never miss MOT or tax again</span>
                </div>
                <div class="feature-item">
                    <span>✓</span>
                    <span><strong>Track multiple vehicles</strong> - Manage your whole fleet</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        function showTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById('errorMsg').style.display = 'none';
            document.getElementById('successMsg').style.display = 'none';

            if (tab === 'signin') {
                document.querySelector('.tab:first-child').classList.add('active');
                document.getElementById('signinForm').style.display = 'block';
                document.getElementById('signupForm').style.display = 'none';
            } else {
                document.querySelector('.tab:last-child').classList.add('active');
                document.getElementById('signinForm').style.display = 'none';
                document.getElementById('signupForm').style.display = 'block';
            }
        }

        // Sign In
        document.getElementById('signinForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = e.target.querySelector('.btn');
            btn.disabled = true;
            btn.textContent = 'Signing in...';

            const errorMsg = document.getElementById('errorMsg');
            errorMsg.style.display = 'none';

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: document.getElementById('signinEmail').value,
                        password: document.getElementById('signinPassword').value
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('glovbox_token', data.token);
                    localStorage.setItem('glovbox_user', JSON.stringify(data.user));
                    window.location.href = '/dashboard.html';
                } else {
                    errorMsg.textContent = data.error || 'Invalid email or password';
                    errorMsg.style.display = 'block';
                }
            } catch (error) {
                errorMsg.textContent = 'Sign in failed. Please try again.';
                errorMsg.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Sign In';
            }
        });

        // Sign Up
        document.getElementById('signupForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = e.target.querySelector('.btn');
            btn.disabled = true;
            btn.textContent = 'Creating account...';

            const errorMsg = document.getElementById('errorMsg');
            const successMsg = document.getElementById('successMsg');
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';

            const password = document.getElementById('signupPassword').value;
            if (password.length < 8) {
                errorMsg.textContent = 'Password must be at least 8 characters';
                errorMsg.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Create Account';
                return;
            }

            try {
                const response = await fetch('/api/auth/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: document.getElementById('signupName').value,
                        email: document.getElementById('signupEmail').value,
                        password: password
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('glovbox_token', data.token);
                    localStorage.setItem('glovbox_user', JSON.stringify(data.user));
                    successMsg.textContent = 'Account created! Redirecting to dashboard...';
                    successMsg.style.display = 'block';
                    setTimeout(() => {
                        window.location.href = '/dashboard.html';
                    }, 1500);
                } else {
                    errorMsg.textContent = data.error || 'Sign up failed';
                    errorMsg.style.display = 'block';
                }
            } catch (error) {
                errorMsg.textContent = 'Sign up failed. Please try again.';
                errorMsg.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Create Account';
            }
        });
    </script>
</body>
</html>

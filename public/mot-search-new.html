<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find MOT Centre - Glovbox</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}:root{--blue:#0B3D91;--orange:#FF6B35;--green:#10B981;--bg:#F8FAFC;--white:#FFF;--border:#E2E8F0;--text:#1E293B}body{font-family:'Inter',sans-serif;background:var(--bg)}nav{background:var(--white);border-bottom:1px solid var(--border);padding:16px 32px}.nav-container{max-width:1280px;margin:0 auto;display:flex;justify-content:space-between;align-items:center}.logo{font-size:20px;font-weight:700;color:var(--blue);text-decoration:none}.nav-links{display:flex;gap:32px;align-items:center}.nav-link{color:var(--text);text-decoration:none;font-weight:500}.container{max-width:1000px;margin:40px auto;padding:0 32px}h1{font-size:32px;color:var(--blue);margin-bottom:8px}.subtitle{color:#64748B;margin-bottom:40px}.search-card{background:var(--white);border:1px solid var(--border);border-radius:16px;padding:40px}input{width:100%;padding:16px;border:2px solid var(--border);border-radius:8px;font-size:16px;margin-bottom:16px}button{width:100%;background:var(--orange);color:white;padding:18px;border-radius:8px;border:none;font-weight:700;cursor:pointer}.loading{display:none;text-align:center;padding:40px}.spinner{border:3px solid var(--border);border-top:3px solid var(--blue);border-radius:50%;width:40px;height:40px;animation:spin 0.8s linear infinite;margin:0 auto 16px}@keyframes spin{to{transform:rotate(360deg)}}.results{display:none}.centre-card{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:16px}.centre-header{display:flex;justify-content:space-between;margin-bottom:16px}.centre-name{font-size:20px;font-weight:700;color:var(--blue)}.centre-distance{background:var(--bg);padding:6px 16px;border-radius:20px;font-weight:700;color:var(--blue)}.centre-info{margin-bottom:8px;font-size:14px}.centre-hours{font-size:13px;color:#64748B;margin:12px 0;padding:12px;background:var(--bg);border-radius:8px}.btn-call{background:var(--blue);color:white;padding:12px 24px;border-radius:8px;text-decoration:none;display:inline-block;font-weight:600;margin-top:12px;margin-right:8px}.btn-book{background:var(--orange);color:white;padding:12px 24px;border-radius:8px;text-decoration:none;display:inline-block;font-weight:600;margin-top:12px}.partner-badge{background:#FEF3C7;color:#92400E;padding:4px 12px;border-radius:12px;font-size:12px;font-weight:600;display:inline-block;margin-bottom:12px}
</style>
</head>
<body>
<nav><div class="nav-container"><a href="/" class="logo">Glovbox</a><div class="nav-links"><a href="/" class="nav-link">Home</a><a href="/insurance.html" class="nav-link">Insurance</a><a href="/signin.html" class="nav-link">Sign In</a></div></div></nav>
<div class="container"><h1>Find MOT Centre Near You</h1><p class="subtitle">Real distances, opening hours, and phone numbers from trusted partners</p>
<div class="search-card"><input type="text" id="postcode" placeholder="Enter your postcode (e.g. SW1A 1AA)"><button onclick="search()">Find MOT Centres</button></div>
<div class="loading" id="loading"><div class="spinner"></div><p>Searching nearby centres...</p></div>
<div class="results" id="results"></div></div>
<script>
async function search(){const postcode=document.getElementById('postcode').value;if(!postcode){alert('Please enter a postcode');return}document.getElementById('loading').style.display='block';document.getElementById('results').style.display='none';try{const response=await fetch(`/api/mot-centres?postcode=${encodeURIComponent(postcode)}`);const data=await response.json();document.getElementById('loading').style.display='none';if(!response.ok){alert(data.error);return}const resultsDiv=document.getElementById('results');if(data.centres.length===0){resultsDiv.innerHTML='<p>No MOT centres found. Try a different postcode.</p>'}else{resultsDiv.innerHTML=data.centres.map(c=>`<div class="centre-card"><div class="centre-header"><div class="centre-name">${c.name}</div><div class="centre-distance">${c.distance}</div></div><div class="centre-info">📍 ${c.address}</div><div class="centre-info">⭐ ${c.rating} (${c.ratingsCount} reviews)</div><div class="centre-info">📞 ${c.phoneNumber}</div>${c.openingHours.length>0?`<div class="centre-hours"><strong>Hours:</strong><br>${c.openingHours.slice(0,3).join('<br>')}</div>`:''}${c.isOpenNow?'<div style="color:var(--green);font-weight:600;margin-top:8px">🟢 Open Now</div>':''}<a href="tel:${c.phoneNumber}" class="btn-call">Call to Book</a></div>`).join('')+'<div style="margin-top:32px;padding:32px;background:var(--white);border:2px solid var(--orange);border-radius:16px;text-align:center"><div class="partner-badge">RECOMMENDED PARTNER</div><h3 style="color:var(--blue);margin-bottom:12px">Book with F1 Autocentres</h3><p style="margin-bottom:20px;color:#64748B">Trusted UK-wide MOT service • Book online in minutes</p><a href="https://www.f1autocentres.co.uk/mot" target="_blank" class="btn-book" id="f1-affiliate-link">Book MOT at F1 Autocentres</a><p style="margin-top:12px;font-size:12px;color:#64748B">Opens in new window</p></div>'}resultsDiv.style.display='block'}catch(error){document.getElementById('loading').style.display='none';alert('Error searching. Please try again.')}}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password - Glovbox</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">

<div class="min-h-screen flex items-center justify-center px-4">
  <div class="max-w-md w-full">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-blue-900 mb-2">🚗 Glovbox</h1>
      <h2 class="text-2xl font-bold text-gray-900">Set New Password</h2>
    </div>

    <div class="bg-white rounded-2xl shadow-lg p-8">
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">New Password</label>
          <input
            type="password"
            id="password"
            placeholder="At least 8 characters"
            class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-blue-500 focus:outline-none"
          />
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Confirm Password</label>
          <input
            type="password"
            id="confirmPassword"
            placeholder="Re-enter password"
            class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-blue-500 focus:outline-none"
            onkeypress="if(event.key==='Enter') resetPassword()"
          />
        </div>

        <p id="error" class="text-red-600 text-sm hidden"></p>

        <button
          onclick="resetPassword()"
          id="resetBtn"
          class="w-full bg-orange-500 text-white py-3 rounded-lg font-bold hover:bg-orange-600"
        >
          Reset Password
        </button>
      </div>
    </div>
  </div>
</div>

<script>
async function resetPassword() {
  const password = document.getElementById('password').value;
  const confirm = document.getElementById('confirmPassword').value;
  const error = document.getElementById('error');
  const btn = document.getElementById('resetBtn');
  
  error.classList.add('hidden');
  
  if (!password || !confirm) {
    error.textContent = 'Please fill all fields';
    error.classList.remove('hidden');
    return;
  }
  
  if (password !== confirm) {
    error.textContent = 'Passwords do not match';
    error.classList.remove('hidden');
    return;
  }
  
  if (password.length < 8) {
    error.textContent = 'Password must be at least 8 characters';
    error.classList.remove('hidden');
    return;
  }
  
  const token = new URLSearchParams(window.location.search).get('token');
  if (!token) {
    error.textContent = 'Invalid reset link';
    error.classList.remove('hidden');
    return;
  }
  
  btn.disabled = true;
  btn.textContent = 'Resetting...';
  
  try {
    const response = await fetch('/api/reset-password', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({token, newPassword: password})
    });
    
    const data = await response.json();
    
    if (response.ok) {
      alert('✅ Password reset successful! Redirecting to sign in...');
      window.location.href = '/signin.html';
    } else {
      error.textContent = data.error;
      error.classList.remove('hidden');
    }
  } catch (err) {
    error.textContent = 'Network error. Please try again.';
    error.classList.remove('hidden');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Reset Password';
  }
}
</script>

</body>
</html>

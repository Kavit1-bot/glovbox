<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Contact - Glovbox</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Inter',sans-serif;background:#F8FAFC;padding:40px 20px}.container{max-width:700px;margin:0 auto}.card{background:white;border:1px solid #E2E8F0;border-radius:16px;padding:48px}h1{font-size:32px;color:#0B3D91;margin-bottom:12px}.subtitle{color:#64748B;margin-bottom:32px}.form-group{margin-bottom:20px}label{display:block;font-weight:600;margin-bottom:8px;font-size:14px}input,select,textarea{width:100%;padding:14px;border:2px solid #E2E8F0;border-radius:8px;font-family:'Inter',sans-serif;font-size:15px}textarea{min-height:150px}.btn{width:100%;background:#FF6B35;color:white;padding:16px;border-radius:8px;border:none;font-weight:700;cursor:pointer}.btn:hover{background:#E85A2A}.success{display:none;background:#D1FAE5;border:1px solid #10B981;color:#065F46;padding:16px;border-radius:8px;margin-bottom:24px}</style></head><body><div class="container"><div class="card"><a href="/" style="color:#0B3D91;text-decoration:none;font-weight:700">← Back to Home</a><h1 style="margin-top:24px">Contact & Enquiries</h1><p class="subtitle">Have a question? We're here to help.</p><div id="success" class="success"></div><form id="contactForm"><div class="form-group"><label>Your Name *</label><input type="text" id="name" required></div><div class="form-group"><label>Email Address *</label><input type="email" id="email" required></div><div class="form-group"><label>Reason for Contact *</label><select id="reason" required><option value="">Select...</option><option>General Support</option><option>Privacy/Data Request</option><option>Legal Question</option><option>Billing Issue</option><option>Technical Problem</option><option>Feature Request</option><option>Other</option></select></div><

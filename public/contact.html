<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us - Glovbox</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">

<nav class="bg-white border-b">
  <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
    <div class="flex items-center gap-2">
      <span class="text-3xl">🚗</span>
      <span class="text-2xl font-bold text-blue-900">Glovbox</span>
    </div>
    <a href="/" class="text-gray-700 hover:text-blue-900 font-semibold">← Back to Home</a>
  </div>
</nav>

<div class="max-w-2xl mx-auto px-6 py-12">
  <div class="text-center mb-12">
    <h1 class="text-4xl font-bold text-blue-900 mb-4">Contact Us</h1>
    <p class="text-xl text-gray-600">We'd love to hear from you</p>
  </div>

  <!-- Contact Form -->
  <div id="form" class="bg-white rounded-2xl shadow-lg p-8">
    <div class="space-y-6">
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2">Your Name</label>
        <input
          type="text"
          id="name"
          placeholder="John Doe"
          class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-blue-500 focus:outline-none"
        />
      </div>

      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2">Email Address</label>
        <input
          type="email"
          id="email"
          placeholder="you@example.com"
          class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-blue-500 focus:outline-none"
        />
      </div>

      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2">Message</label>
        <textarea
          id="message"
          rows="6"
          placeholder="How can we help you?"
          class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-blue-500 focus:outline-none resize-none"
        ></textarea>
      </div>

      <p id="error" class="text-red-600 text-sm hidden"></p>

      <button
        onclick="sendMessage()"
        id="submitBtn"
        class="w-full bg-orange-500 text-white py-4 rounded-lg font-bold text-lg hover:bg-orange-600"
      >
        Send Message
      </button>
    </div>

    <div class="mt-8 pt-8 border-t text-center">
      <p class="text-gray-600 mb-2">Or email us directly:</p>
      <a href="mailto:support@glovbox.net" class="text-blue-600 hover:underline font-semibold text-lg">
        support@glovbox.net
      </a>
    </div>
  </div>

  <!-- Success Message -->
  <div id="success" class="hidden bg-white rounded-2xl shadow-lg p-8 text-center">
    <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
      <svg class="w-8 h-8 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
      </svg>
    </div>
    <h3 class="text-2xl font-bold text-gray-900 mb-2">Message Sent!</h3>
    <p class="text-gray-600 mb-6">We've received your message and will get back to you within 24 hours.</p>
    <button onclick="resetForm()" class="text-blue-600 hover:underline font-semibold">
      Send Another Message
    </button>
  </div>
</div>

<footer class="bg-gray-900 text-white py-8 mt-12">
  <div class="max-w-7xl mx-auto px-6 text-center">
    <p class="mb-2">© 2026 Glovbox. All rights reserved.</p>
    <p class="text-sm text-gray-400">Unauthorized copying or use of this website is prohibited.</p>
  </div>
</footer>

<script>
async function sendMessage() {
  const name = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim();
  const message = document.getElementById('message').value.trim();
  const error = document.getElementById('error');
  const btn = document.getElementById('submitBtn');

  error.classList.add('hidden');

  if (!name || !email || !message) {
    error.textContent = 'Please fill in all fields';
    error.classList.remove('hidden');
    return;
  }

  const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  if (!emailRegex.test(email)) {
    error.textContent = 'Please enter a valid email address';
    error.classList.remove('hidden');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Sending...';

  try {
    const response = await fetch('/api/contact', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({name, email, message})
    });

    const data = await response.json();

    if (response.ok) {
      document.getElementById('form').classList.add('hidden');
      document.getElementById('success').classList.remove('hidden');
    } else {
      error.textContent = data.error || 'Failed to send message';
      error.classList.remove('hidden');
    }
  } catch (err) {
    error.textContent = 'Network error. Please try again.';
    error.classList.remove('hidden');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Send Message';
  }
}

function resetForm() {
  document.getElementById('name').value = '';
  document.getElementById('email').value = '';
  document.getElementById('message').value = '';
  document.getElementById('form').classList.remove('hidden');
  document.getElementById('success').classList.add('hidden');
}
</script>

</body>
</html>

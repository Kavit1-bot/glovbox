<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Glovbox</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body { font-family: 'Inter', sans-serif; }
.modal-backdrop { background: rgba(0,0,0,0.5); }
</style>
</head>
<body class="bg-gray-50">
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

function Dashboard() {
  const [user, setUser] = useState(null);
  const [vehicles, setVehicles] = useState([]);
  const [selectedVehicle, setSelectedVehicle] = useState(null);
  const [loading, setLoading] = useState(true);
  const [showAddVehicle, setShowAddVehicle] = useState(false);

  useEffect(() => {
    checkAuth();
  }, []);

  async function checkAuth() {
    const token = localStorage.getItem('glovbox_token');
    const userData = localStorage.getItem('glovbox_user');
    
    if (!token) {
      window.location.href = '/signin.html';
      return;
    }
    
    if (userData) setUser(JSON.parse(userData));
    await loadVehicles();
  }

  async function loadVehicles() {
    const token = localStorage.getItem('glovbox_token');
    try {
      const response = await fetch('/api/user/vehicles', {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      const data = await response.json();
      setVehicles(data.vehicles || []);
      if (data.vehicles?.length > 0) {
        setSelectedVehicle(data.vehicles[0]);
      }
    } catch (error) {
      console.error('Error loading vehicles:', error);
    } finally {
      setLoading(false);
    }
  }

  function signOut() {
    localStorage.removeItem('glovbox_token');
    localStorage.removeItem('glovbox_user');
    window.location.href = '/';
  }

  if (loading) {
    return (
      <div className="flex items-center justify-center min-h-screen">
        <div className="text-center">
          <div className="animate-spin w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full mx-auto mb-4"></div>
          <p className="text-gray-600">Loading...</p>
        </div>
      </div>
    );
  }

  return (
    <div className="min-h-screen">
      {/* Navigation */}
      <nav className="bg-white border-b border-gray-200 px-4 md:px-6 py-4">
        <div className="flex justify-between items-center max-w-7xl mx-auto">
          <div>
            <h1 className="text-xl md:text-2xl font-bold text-blue-900">Glovbox Dashboard</h1>
            {selectedVehicle && (
              <p className="text-sm text-gray-600 mt-1">
                {selectedVehicle.make} {selectedVehicle.model} • {selectedVehicle.registrationNumber}
              </p>
            )}
          </div>
          <div className="flex items-center gap-4">
            <a href="/my-account.html" className="text-gray-600 hover:text-gray-900 font-semibold">
              My Account
            </a>
            <button onClick={signOut} className="text-gray-600 hover:text-gray-900 font-semibold">
              Sign Out
            </button>
          </div>
        </div>
      </nav>

      <div className="max-w-7xl mx-auto p-4 md:p-6">
        {vehicles.length === 0 ? (
          <WelcomeScreen onAddVehicle={() => setShowAddVehicle(true)} />
        ) : (
          <>
            <VehicleOverview 
              vehicle={selectedVehicle} 
              onAddVehicle={() => setShowAddVehicle(true)}
            />
            <AllServices vehicle={selectedVehicle} />
          </>
        )}
      </div>

      {showAddVehicle && (
        <AddVehicleModal 
          onClose={() => setShowAddVehicle(false)}
          onSuccess={() => {
            setShowAddVehicle(false);
            loadVehicles();
          }}
        />
      )}
    </div>
  );
}

function WelcomeScreen({ onAddVehicle }) {
  return (
    <div className="max-w-3xl mx-auto mt-10">
      <div className="bg-white rounded-2xl shadow-lg p-8 md:p-12 text-center">
        <div className="text-7xl mb-6">🚗</div>
        <h2 className="text-3xl md:text-4xl font-bold text-gray-900 mb-4">
          Welcome to Glovbox!
        </h2>
        <p className="text-lg text-gray-600 mb-8">
          Your all-in-one vehicle management platform
        </p>
        
        <button 
          onClick={onAddVehicle}
          className="bg-orange-500 text-white px-8 py-4 rounded-lg font-bold text-lg hover:bg-orange-600 shadow-lg mb-8"
        >
          + Add Your First Vehicle
        </button>
        
        <div className="grid md:grid-cols-3 gap-6 mt-12 text-left">
          <div className="p-4">
            <div className="text-3xl mb-2">🔔</div>
            <h3 className="font-bold text-blue-900 mb-2">Never Miss Deadlines</h3>
            <p className="text-sm text-gray-600">Get email reminders before MOT and tax expire</p>
          </div>
          <div className="p-4">
            <div className="text-3xl mb-2">📖</div>
            <h3 className="font-bold text-blue-900 mb-2">Track Service History</h3>
            <p className="text-sm text-gray-600">Digital logbook increases resale value</p>
          </div>
          <div className="p-4">
            <div className="text-3xl mb-2">💰</div>
            <h3 className="font-bold text-blue-900 mb-2">Save Money</h3>
            <p className="text-sm text-gray-600">Compare insurance and find cheap MOT centres</p>
          </div>
        </div>
      </div>
    </div>
  );
}

function AddVehicleModal({ onClose, onSuccess }) {
  const [reg, setReg] = useState('');
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');
  const [vehicleData, setVehicleData] = useState(null);

  async function searchVehicle() {
    if (!reg || reg.length < 2) {
      setError('Please enter a valid registration');
      return;
    }

    setLoading(true);
    setError('');

    try {
      const response = await fetch(`/api/vehicle/${reg.toUpperCase().replace(/\s/g, '')}`);
      const data = await response.json();

      if (!response.ok) {
        setError(data.error || 'Vehicle not found');
        setVehicleData(null);
      } else {
        setVehicleData(data);
        setError('');
      }
    } catch (error) {
      setError('Error looking up vehicle');
      setVehicleData(null);
    } finally {
      setLoading(false);
    }
  }

  async function addVehicle() {
    setLoading(true);
    const token = localStorage.getItem('glovbox_token');

    try {
      const response = await fetch('/api/user/vehicles', {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${token}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ registrationNumber: reg.toUpperCase().replace(/\s/g, '') })
      });

      if (response.ok) {
        onSuccess();
      } else {
        setError('Failed to add vehicle');
      }
    } catch (error) {
      setError('Error adding vehicle');
    } finally {
      setLoading(false);
    }
  }

  return (
    <div className="fixed inset-0 modal-backdrop flex items-center justify-center z-50 p-4">
      <div className="bg-white rounded-2xl shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto">
        <div className="p-6 md:p-8">
          <div className="flex justify-between items-center mb-6">
            <h2 className="text-2xl font-bold text-blue-900">Add Vehicle</h2>
            <button onClick={onClose} className="text-gray-400 hover:text-gray-600 text-3xl leading-none">
              ×
            </button>
          </div>

          <div className="space-y-6">
            <div>
              <label className="block text-sm font-semibold text-gray-700 mb-2">
                Vehicle Registration Number
              </label>
              <div className="flex gap-3">
                <input
                  type="text"
                  value={reg}
                  onChange={(e) => setReg(e.target.value.toUpperCase())}
                  placeholder="e.g. AB12 CDE"
                  maxLength="8"
                  className="flex-1 px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-blue-500 focus:outline-none text-lg font-semibold"
                  onKeyPress={(e) => e.key === 'Enter' && searchVehicle()}
                />
                <button
                  onClick={searchVehicle}
                  disabled={loading}
                  className="bg-blue-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-blue-700 disabled:bg-gray-300"
                >
                  {loading ? 'Searching...' : 'Search'}
                </button>
              </div>
              {error && <p className="text-red-600 text-sm mt-2">⚠️ {error}</p>}
            </div>

            {vehicleData && (
              <div className="bg-green-50 border-2 border-green-200 rounded-lg p-6">
                <h3 className="font-bold text-lg text-green-900 mb-4">✓ Vehicle Found</h3>
                <div className="grid md:grid-cols-2 gap-4 mb-6">
                  <div>
                    <p className="text-sm text-gray-600">Make & Model</p>
                    <p className="font-bold text-lg">{vehicleData.make} {vehicleData.model}</p>
                  </div>
                  <div>
                    <p className="text-sm text-gray-600">Year</p>
                    <p className="font-bold text-lg">{vehicleData.yearOfManufacture}</p>
                  </div>
                  <div>
                    <p className="text-sm text-gray-600">MOT Expires</p>
                    <p className={`font-bold ${vehicleData.motStatus === 'Valid' ? 'text-green-600' : 'text-red-600'}`}>
                      {vehicleData.motExpiryDate || 'N/A'}
                    </p>
                  </div>
                  <div>
                    <p className="text-sm text-gray-600">Tax Due</p>
                    <p className={`font-bold ${vehicleData.taxStatus === 'Taxed' ? 'text-green-600' : 'text-red-600'}`}>
                      {vehicleData.taxDueDate || 'N/A'}
                    </p>
                  </div>
                </div>
                <button
                  onClick={addVehicle}
                  disabled={loading}
                  className="w-full bg-orange-500 text-white py-3 rounded-lg font-bold hover:bg-orange-600 disabled:bg-gray-300"
                >
                  {loading ? 'Adding...' : '✓ Add to Dashboard'}
                </button>
              </div>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

function VehicleOverview({ vehicle, onAddVehicle }) {
  if (!vehicle) return null;

  return (
    <div className="space-y-6 mb-8">
      <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
        <div className="flex justify-between items-center mb-4">
          <h3 className="text-xl font-bold text-blue-900">🚗 Vehicle Details</h3>
          <button
            onClick={onAddVehicle}
            className="text-blue-600 hover:text-blue-700 font-semibold text-sm"
          >
            + Add Another Vehicle
          </button>
        </div>
        <div className="grid md:grid-cols-3 gap-4">
          <div>
            <p className="text-sm text-gray-600">Registration</p>
            <p className="font-bold text-lg text-blue-900">{vehicle.registrationNumber}</p>
          </div>
          <div>
            <p className="text-sm text-gray-600">Make & Model</p>
            <p className="font-bold text-lg">{vehicle.make} {vehicle.model}</p>
          </div>
          <div>
            <p className="text-sm text-gray-600">Year</p>
            <p className="font-bold text-lg">{vehicle.yearOfManufacture || 'N/A'}</p>
          </div>
        </div>
      </div>

      <div className="grid md:grid-cols-2 gap-6">
        <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
          <h3 className="text-lg font-bold text-blue-900 mb-4">🔧 MOT Status</h3>
          <div className="space-y-3">
            <div className="flex justify-between">
              <span className="text-gray-600">Status:</span>
              <span className={`font-semibold ${vehicle.motStatus === 'Valid' ? 'text-green-600' : 'text-red-600'}`}>
                {vehicle.motStatus || 'Unknown'}
              </span>
            </div>
            <div className="flex justify-between">
              <span className="text-gray-600">Expires:</span>
              <span className="font-semibold">{vehicle.motExpiryDate || 'N/A'}</span>
            </div>
          </div>
        </div>

        <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
          <h3 className="text-lg font-bold text-blue-900 mb-4">💷 Road Tax</h3>
          <div className="space-y-3">
            <div className="flex justify-between">
              <span className="text-gray-600">Status:</span>
              <span className={`font-semibold ${vehicle.taxStatus === 'Taxed' ? 'text-green-600' : 'text-red-600'}`}>
                {vehicle.taxStatus || 'Unknown'}
              </span>
            </div>
            <div className="flex justify-between">
              <span className="text-gray-600">Due:</span>
              <span className="font-semibold">{vehicle.taxDueDate || 'N/A'}</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

function AllServices({ vehicle }) {
  const services = [
    {
      icon: '🔧',
      title: 'MOT Search',
      description: 'Find MOT centres near you with phone numbers and opening hours',
      link: '/mot-search.html',
      color: 'border-orange-200 hover:border-orange-500 hover:bg-orange-50'
    },
    {
      icon: '💷',
      title: 'Pay Road Tax',
      description: 'Direct link to GOV.UK for secure payment',
      link: 'https://www.gov.uk/vehicle-tax',
      color: 'border-blue-200 hover:border-blue-500 hover:bg-blue-50',
      external: true
    },
    {
      icon: '💰',
      title: 'Insurance',
      description: 'Compare quotes from leading UK insurers',
      link: '/insurance.html',
      color: 'border-green-200 hover:border-green-500 hover:bg-green-50'
    },
    {
      icon: '🚗',
      title: 'Breakdown Cover',
      description: 'Compare AA, RAC, and Green Flag breakdown packages',
      link: '/breakdown.html',
      color: 'border-purple-200 hover:border-purple-500 hover:bg-purple-50'
    },
    {
      icon: '📖',
      title: 'Service Logbook',
      description: 'Track all maintenance and increase resale value',
      link: '/service-logbook.html',
      color: 'border-indigo-200 hover:border-indigo-500 hover:bg-indigo-50'
    },
    {
      icon: '👤',
      title: 'My Account',
      description: 'Manage reminders, settings, and account details',
      link: '/my-account.html',
      color: 'border-gray-200 hover:border-gray-500 hover:bg-gray-50'
    }
  ];

  return (
    <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
      <h2 className="text-2xl font-bold text-blue-900 mb-6">📋 All Services</h2>
      <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-4">
        {services.map((service, i) => (
          <a
            key={i}
            href={service.link}
            target={service.external ? '_blank' : '_self'}
            className={`border-2 rounded-xl p-6 transition-all cursor-pointer ${service.color}`}
          >
            <div className="text-4xl mb-3">{service.icon}</div>
            <h3 className="font-bold text-blue-900 mb-2 text-lg">{service.title}</h3>
            <p className="text-sm text-gray-600">{service.description}</p>
          </a>
        ))}
      </div>
    </div>
  );
}

ReactDOM.render(<Dashboard />, document.getElementById('root'));
</script>
</body>
</html>

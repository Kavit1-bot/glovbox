<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Glovbox</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body { font-family: 'Inter', sans-serif; }
</style>
</head>
<body class="bg-gray-50">
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

// Main Dashboard Component
function Dashboard() {
  const [vehicles, setVehicles] = useState([]);
  const [selectedVehicle, setSelectedVehicle] = useState(null);
  const [view, setView] = useState('overview'); // 'overview' or 'logbook'
  const [user, setUser] = useState(null);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    const userData = localStorage.getItem('glovbox_user');
    if (userData) {
      setUser(JSON.parse(userData));
    }
    
    // Check URL for view parameter
    const params = new URLSearchParams(window.location.search);
    const urlView = params.get('view');
    if (urlView === 'logbook') {
      setView('logbook');
    }
    
    loadVehicles();
  }, []);

  async function loadVehicles() {
    const token = localStorage.getItem('glovbox_token');
    if (!token) {
      window.location.href = '/signin.html';
      return;
    }

    try {
      const response = await fetch('/api/user/vehicles', {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      const data = await response.json();
      setVehicles(data.vehicles || []);
      if (data.vehicles?.length > 0) {
        setSelectedVehicle(data.vehicles[0]);
      }
    } catch (error) {
      console.error('Error loading vehicles:', error);
    } finally {
      setLoading(false);
    }
  }

  function signOut() {
    localStorage.removeItem('glovbox_token');
    localStorage.removeItem('glovbox_user');
    window.location.href = '/';
  }

  if (loading) {
    return (
      <div className="flex items-center justify-center min-h-screen">
        <div className="text-center">
          <div className="animate-spin w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full mx-auto mb-4"></div>
          <p className="text-gray-600">Loading dashboard...</p>
        </div>
      </div>
    );
  }

  if (!selectedVehicle) {
    return (
      <div className="min-h-screen">
        <nav className="bg-white border-b border-gray-200 px-6 py-4">
          <div className="flex justify-between items-center">
            <h1 className="text-2xl font-bold text-blue-900">Glovbox Dashboard</h1>
            <button onClick={signOut} className="text-gray-600 hover:text-gray-900">
              Sign Out
            </button>
          </div>
        </nav>
        <div className="max-w-2xl mx-auto mt-20 text-center px-4">
          <div className="text-6xl mb-4">🚗</div>
          <h2 className="text-3xl font-bold text-gray-900 mb-4">No Vehicles Yet</h2>
          <p className="text-gray-600 mb-8">Add your first vehicle to start tracking MOT, tax, and service history</p>
          <button 
            onClick={() => window.location.href = '/'}
            className="bg-orange-500 text-white px-8 py-3 rounded-lg font-semibold hover:bg-orange-600"
          >
            Add Vehicle
          </button>
        </div>
      </div>
    );
  }

  return (
    <div className="min-h-screen">
      {/* Navigation */}
      <nav className="bg-white border-b border-gray-200 px-4 md:px-6 py-4">
        <div className="flex justify-between items-center">
          <div>
            <h1 className="text-xl md:text-2xl font-bold text-blue-900">Glovbox Dashboard</h1>
            <p className="text-sm text-gray-600 mt-1">
              {selectedVehicle.make} {selectedVehicle.model} • {selectedVehicle.registrationNumber}
            </p>
          </div>
          <button 
            onClick={signOut} 
            className="text-gray-600 hover:text-gray-900 text-sm md:text-base"
          >
            Sign Out
          </button>
        </div>
      </nav>

      {/* Tab Navigation */}
      <div className="bg-white border-b border-gray-200">
        <div className="max-w-7xl mx-auto px-4 md:px-6">
          <div className="flex gap-8">
            <button
              onClick={() => setView('overview')}
              className={`py-4 px-2 border-b-2 font-semibold transition-colors ${
                view === 'overview' 
                  ? 'border-blue-600 text-blue-600' 
                  : 'border-transparent text-gray-500 hover:text-gray-700'
              }`}
            >
              Overview
            </button>
            <button
              onClick={() => setView('logbook')}
              className={`py-4 px-2 border-b-2 font-semibold transition-colors ${
                view === 'logbook' 
                  ? 'border-blue-600 text-blue-600' 
                  : 'border-transparent text-gray-500 hover:text-gray-700'
              }`}
            >
              📖 Service Logbook
            </button>
          </div>
        </div>
      </div>

      {/* Content */}
      <div className="max-w-7xl mx-auto p-4 md:p-6">
        {view === 'overview' ? (
          <VehicleOverview vehicle={selectedVehicle} />
        ) : (
          <ServiceLogbook vehicle={selectedVehicle} user={user} />
        )}
      </div>
    </div>
  );
}

// Vehicle Overview Component
function VehicleOverview({ vehicle }) {
  return (
    <div className="space-y-6">
      {/* Vehicle Details Card */}
      <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
        <h3 className="text-xl font-bold text-blue-900 mb-4">🚗 Vehicle Details</h3>
        <div className="grid md:grid-cols-3 gap-4">
          <div>
            <p className="text-sm text-gray-600">Registration</p>
            <p className="font-bold text-lg text-blue-900">{vehicle.registrationNumber}</p>
          </div>
          <div>
            <p className="text-sm text-gray-600">Make & Model</p>
            <p className="font-bold text-lg">{vehicle.make} {vehicle.model}</p>
          </div>
          <div>
            <p className="text-sm text-gray-600">Year</p>
            <p className="font-bold text-lg">{vehicle.yearOfManufacture || 'N/A'}</p>
          </div>
          <div>
            <p className="text-sm text-gray-600">Colour</p>
            <p className="font-bold text-lg">{vehicle.colour || 'N/A'}</p>
          </div>
          <div>
            <p className="text-sm text-gray-600">Fuel Type</p>
            <p className="font-bold text-lg">{vehicle.fuelType || 'N/A'}</p>
          </div>
          <div>
            <p className="text-sm text-gray-600">Engine Size</p>
            <p className="font-bold text-lg">{vehicle.engineCapacity ? vehicle.engineCapacity + 'cc' : 'N/A'}</p>
          </div>
        </div>
      </div>

      <div className="grid md:grid-cols-2 gap-6">
        {/* MOT Card */}
        <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
          <h3 className="text-lg font-bold text-blue-900 mb-4">🔧 MOT Status</h3>
          <div className="space-y-3">
            <div className="flex justify-between">
              <span className="text-gray-600">Status:</span>
              <span className={`font-semibold ${vehicle.motStatus === 'Valid' ? 'text-green-600' : 'text-red-600'}`}>
                {vehicle.motStatus || 'Unknown'}
              </span>
            </div>
            <div className="flex justify-between">
              <span className="text-gray-600">Expires:</span>
              <span className="font-semibold">{vehicle.motExpiryDate || 'N/A'}</span>
            </div>
          </div>
          <a 
            href="/mot-search.html"
            className="block w-full mt-4 bg-orange-500 text-white py-2 rounded-lg font-semibold hover:bg-orange-600 text-center"
          >
            Find MOT Centre
          </a>
        </div>

        {/* Tax Card */}
        <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
          <h3 className="text-lg font-bold text-blue-900 mb-4">💷 Road Tax</h3>
          <div className="space-y-3">
            <div className="flex justify-between">
              <span className="text-gray-600">Status:</span>
              <span className={`font-semibold ${vehicle.taxStatus === 'Taxed' ? 'text-green-600' : 'text-red-600'}`}>
                {vehicle.taxStatus || 'Unknown'}
              </span>
            </div>
            <div className="flex justify-between">
              <span className="text-gray-600">Due:</span>
              <span className="font-semibold">{vehicle.taxDueDate || 'N/A'}</span>
            </div>
          </div>
          <a 
            href="https://www.gov.uk/vehicle-tax" 
            target="_blank"
            className="block w-full mt-4 bg-blue-600 text-white py-2 rounded-lg font-semibold hover:bg-blue-700 text-center"
          >
            Pay Tax on GOV.UK
          </a>
        </div>
      </div>

      {/* Available Services */}
      <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
        <h3 className="text-xl font-bold text-blue-900 mb-4">📋 Available Services</h3>
        <div className="grid md:grid-cols-3 gap-4">
          <a 
            href="/mot-search.html"
            className="border-2 border-gray-200 rounded-lg p-4 hover:border-blue-500 hover:shadow-md transition-all cursor-pointer"
          >
            <div className="text-3xl mb-2">🔧</div>
            <h4 className="font-bold text-blue-900 mb-1">MOT Finder</h4>
            <p className="text-sm text-gray-600">Find centres near you with phone numbers</p>
          </a>
          
          <a 
            href="/insurance.html"
            className="border-2 border-gray-200 rounded-lg p-4 hover:border-blue-500 hover:shadow-md transition-all cursor-pointer"
          >
            <div className="text-3xl mb-2">💰</div>
            <h4 className="font-bold text-blue-900 mb-1">Insurance</h4>
            <p className="text-sm text-gray-600">Compare quotes from leading insurers</p>
          </a>
          
          <a 
            href="/dashboard.html?view=logbook"
            className="border-2 border-green-200 bg-green-50 rounded-lg p-4 hover:border-green-500 hover:shadow-md transition-all cursor-pointer"
          >
            <div className="text-3xl mb-2">📖</div>
            <h4 className="font-bold text-blue-900 mb-1">Service Logbook <span className="text-xs bg-green-600 text-white px-2 py-1 rounded">NEW</span></h4>
            <p className="text-sm text-gray-600">Track all maintenance history</p>
          </a>
        </div>
      </div>

      {/* Service Logbook Promo */}
      <div className="bg-gradient-to-r from-blue-600 to-blue-700 rounded-xl shadow-lg p-6 text-white">
        <h3 className="text-xl font-bold mb-2">✨ New: Digital Service Logbook</h3>
        <p className="mb-4 text-blue-100">
          Track all your maintenance history, upload receipts, and export professional reports. Increase your vehicle's resale value!
        </p>
        <button 
          onClick={() => window.location.href = '/dashboard.html?view=logbook'}
          className="bg-white text-blue-700 px-6 py-3 rounded-lg font-semibold hover:bg-blue-50"
        >
          Open Service Logbook →
        </button>
      </div>
    </div>
  );
}

// Service Logbook Component (simplified for dashboard)
function ServiceLogbook({ vehicle, user }) {
  const [services, setServices] = useState([]);
  const [showForm, setShowForm] = useState(false);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    loadServices();
  }, [vehicle.registrationNumber]);

  async function loadServices() {
    try {
      const token = localStorage.getItem('glovbox_token');
      const response = await fetch(`/api/vehicles/${vehicle.registrationNumber}/services`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      const data = await response.json();
      setServices(data.services || []);
    } catch (error) {
      console.error('Error loading services:', error);
    } finally {
      setLoading(false);
    }
  }

  if (loading) {
    return <div className="text-center py-12">Loading service history...</div>;
  }

  return (
    <div className="space-y-6">
      {/* Header */}
      <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
        <div className="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
          <div>
            <h2 className="text-2xl font-bold text-blue-900 mb-2">Service History</h2>
            <p className="text-gray-600">
              Track all maintenance and increase your vehicle's resale value
            </p>
          </div>
          <button
            onClick={() => setShowForm(!showForm)}
            className="bg-orange-500 text-white px-6 py-3 rounded-lg font-semibold hover:bg-orange-600 flex items-center justify-center gap-2"
          >
            <span className="text-xl">+</span>
            Add Service Record
          </button>
        </div>
      </div>

      {/* Stats */}
      <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
        <div className="bg-blue-50 rounded-lg p-4 text-center">
          <div className="text-3xl font-bold text-blue-900">{services.length}</div>
          <div className="text-sm text-gray-600 mt-1">Services</div>
        </div>
        <div className="bg-green-50 rounded-lg p-4 text-center">
          <div className="text-3xl font-bold text-green-900">
            £{services.reduce((sum, s) => sum + (s.totalCost || 0), 0).toFixed(0)}
          </div>
          <div className="text-sm text-gray-600 mt-1">Total Spent</div>
        </div>
        <div className="bg-purple-50 rounded-lg p-4 text-center">
          <div className="text-3xl font-bold text-purple-900">
            £{services.length > 0 ? (services.reduce((sum, s) => sum + (s.totalCost || 0), 0) / services.length).toFixed(0) : 0}
          </div>
          <div className="text-sm text-gray-600 mt-1">Avg Cost</div>
        </div>
        <div className="bg-orange-50 rounded-lg p-4 text-center">
          <div className="text-3xl font-bold text-orange-900">
            {vehicle.currentMileage ? vehicle.currentMileage.toLocaleString() : '0'}
          </div>
          <div className="text-sm text-gray-600 mt-1">Miles</div>
        </div>
      </div>

      {/* Service Records */}
      {services.length === 0 ? (
        <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-12 text-center">
          <div className="text-gray-400 mb-4">
            <svg className="w-20 h-20 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
            </svg>
          </div>
          <h3 className="text-2xl font-semibold text-gray-700 mb-2">No Service Records Yet</h3>
          <p className="text-gray-500 mb-4">Start tracking your vehicle's maintenance history</p>
          <button
            onClick={() => setShowForm(true)}
            className="bg-orange-500 text-white px-6 py-3 rounded-lg font-semibold hover:bg-orange-600"
          >
            Add First Service
          </button>
        </div>
      ) : (
        <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
          <h3 className="text-xl font-bold text-blue-900 mb-6">Recent Services</h3>
          <div className="space-y-4">
            {services.slice(0, 5).map((service) => (
              <div key={service.id} className="border-l-4 border-blue-500 pl-4 py-3 bg-gray-50 rounded-r-lg">
                <div className="flex justify-between items-start mb-2">
                  <div>
                    <h4 className="font-bold text-lg text-blue-900">{service.serviceType}</h4>
                    <p className="text-sm text-gray-600">
                      {new Date(service.serviceDate).toLocaleDateString('en-GB')} • {service.mileageAtService?.toLocaleString()} miles
                    </p>
                  </div>
                  {service.totalCost && (
                    <div className="text-xl font-bold text-green-600">£{service.totalCost.toFixed(2)}</div>
                  )}
                </div>
                {service.garageName && (
                  <p className="text-sm text-gray-600">🔧 {service.garageName}</p>
                )}
                {service.description && (
                  <p className="text-sm text-gray-700 mt-2">{service.description}</p>
                )}
              </div>
            ))}
          </div>
        </div>
      )}

      {/* Coming Soon Notice */}
      <div className="bg-blue-50 border border-blue-200 rounded-lg p-4 text-center">
        <p className="text-blue-900 font-semibold">
          🚀 Full service logbook with photo uploads, OCR scanning, and PDF export coming soon!
        </p>
        <p className="text-blue-700 text-sm mt-1">
          We're finalizing the complete interface. Stay tuned!
        </p>
      </div>
    </div>
  );
}

// Render the app
ReactDOM.render(<Dashboard />, document.getElementById('root'));
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Glovbox</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body { font-family: 'Inter', sans-serif; }
.modal-backdrop { background: rgba(0,0,0,0.5); }
</style>
</head>
<body class="bg-gray-50">
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

// Main Dashboard Component
function Dashboard() {
  const [vehicles, setVehicles] = useState([]);
  const [selectedVehicle, setSelectedVehicle] = useState(null);
  const [view, setView] = useState('overview');
  const [user, setUser] = useState(null);
  const [loading, setLoading] = useState(true);
  const [showAddVehicle, setShowAddVehicle] = useState(false);

  useEffect(() => {
    checkAuth();
  }, []);

  async function checkAuth() {
    const token = localStorage.getItem('glovbox_token');
    const userData = localStorage.getItem('glovbox_user');
    
    if (!token) {
      window.location.href = '/signin.html';
      return;
    }
    
    if (userData) {
      setUser(JSON.parse(userData));
    }
    
    const params = new URLSearchParams(window.location.search);
    const urlView = params.get('view');
    if (urlView === 'logbook') {
      setView('logbook');
    }
    
    await loadVehicles();
  }

  async function loadVehicles() {
    const token = localStorage.getItem('glovbox_token');
    
    try {
      const response = await fetch('/api/user/vehicles', {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      const data = await response.json();
      setVehicles(data.vehicles || []);
      if (data.vehicles?.length > 0) {
        setSelectedVehicle(data.vehicles[0]);
      }
    } catch (error) {
      console.error('Error loading vehicles:', error);
    } finally {
      setLoading(false);
    }
  }

  function signOut() {
    localStorage.removeItem('glovbox_token');
    localStorage.removeItem('glovbox_user');
    window.location.href = '/';
  }

  if (loading) {
    return (
      <div className="flex items-center justify-center min-h-screen">
        <div className="text-center">
          <div className="animate-spin w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full mx-auto mb-4"></div>
          <p className="text-gray-600">Loading dashboard...</p>
        </div>
      </div>
    );
  }

  return (
    <div className="min-h-screen">
      {/* Navigation */}
      <nav className="bg-white border-b border-gray-200 px-4 md:px-6 py-4">
        <div className="flex justify-between items-center">
          <div>
            <h1 className="text-xl md:text-2xl font-bold text-blue-900">Glovbox Dashboard</h1>
            {selectedVehicle && (
              <p className="text-sm text-gray-600 mt-1">
                {selectedVehicle.make} {selectedVehicle.model} • {selectedVehicle.registrationNumber}
              </p>
            )}
          </div>
          <button 
            onClick={signOut} 
            className="text-gray-600 hover:text-gray-900 text-sm md:text-base font-semibold"
          >
            Sign Out
          </button>
        </div>
      </nav>

      {/* No Vehicles - Welcome Screen */}
      {vehicles.length === 0 ? (
        <WelcomeScreen onAddVehicle={() => setShowAddVehicle(true)} />
      ) : (
        <>
          {/* Tab Navigation */}
          <div className="bg-white border-b border-gray-200">
            <div className="max-w-7xl mx-auto px-4 md:px-6">
              <div className="flex gap-8">
                <button
                  onClick={() => setView('overview')}
                  className={`py-4 px-2 border-b-2 font-semibold transition-colors ${
                    view === 'overview' 
                      ? 'border-blue-600 text-blue-600' 
                      : 'border-transparent text-gray-500 hover:text-gray-700'
                  }`}
                >
                  Overview
                </button>
                <button
                  onClick={() => setView('logbook')}
                  className={`py-4 px-2 border-b-2 font-semibold transition-colors ${
                    view === 'logbook' 
                      ? 'border-blue-600 text-blue-600' 
                      : 'border-transparent text-gray-500 hover:text-gray-700'
                  }`}
                >
                  📖 Service Logbook
                </button>
              </div>
            </div>
          </div>

          {/* Content */}
          <div className="max-w-7xl mx-auto p-4 md:p-6">
            {view === 'overview' ? (
              <VehicleOverview 
                vehicle={selectedVehicle} 
                onAddVehicle={() => setShowAddVehicle(true)}
              />
            ) : (
              <ServiceLogbook vehicle={selectedVehicle} user={user} />
            )}
          </div>
        </>
      )}

      {/* Add Vehicle Modal */}
      {showAddVehicle && (
        <AddVehicleModal 
          onClose={() => setShowAddVehicle(false)}
          onSuccess={() => {
            setShowAddVehicle(false);
            loadVehicles();
          }}
        />
      )}
    </div>
  );
}

// Welcome Screen for New Users
function WelcomeScreen({ onAddVehicle }) {
  return (
    <div className="max-w-3xl mx-auto mt-20 px-4">
      <div className="bg-white rounded-2xl shadow-lg p-8 md:p-12 text-center">
        <div className="text-7xl mb-6">🚗</div>
        <h2 className="text-3xl md:text-4xl font-bold text-gray-900 mb-4">
          Welcome to Glovbox!
        </h2>
        <p className="text-lg text-gray-600 mb-8">
          Add your first vehicle to start tracking MOT dates, road tax, and service history
        </p>
        
        <button 
          onClick={onAddVehicle}
          className="bg-orange-500 text-white px-8 py-4 rounded-lg font-bold text-lg hover:bg-orange-600 inline-flex items-center gap-2 shadow-lg"
        >
          <span className="text-2xl">+</span>
          Add Your First Vehicle
        </button>
        
        <div className="grid md:grid-cols-3 gap-6 mt-12 text-left">
          <div className="p-4">
            <div className="text-3xl mb-2">🔔</div>
            <h3 className="font-bold text-blue-900 mb-2">Never Miss Deadlines</h3>
            <p className="text-sm text-gray-600">Get email reminders before MOT and tax expire</p>
          </div>
          <div className="p-4">
            <div className="text-3xl mb-2">📖</div>
            <h3 className="font-bold text-blue-900 mb-2">Track Service History</h3>
            <p className="text-sm text-gray-600">Digital logbook increases resale value</p>
          </div>
          <div className="p-4">
            <div className="text-3xl mb-2">💰</div>
            <h3 className="font-bold text-blue-900 mb-2">Save Money</h3>
            <p className="text-sm text-gray-600">Compare insurance and find cheap MOT centres</p>
          </div>
        </div>
      </div>
    </div>
  );
}

// Add Vehicle Modal
function AddVehicleModal({ onClose, onSuccess }) {
  const [reg, setReg] = useState('');
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');
  const [vehicleData, setVehicleData] = useState(null);

  async function searchVehicle() {
    if (!reg || reg.length < 2) {
      setError('Please enter a valid registration');
      return;
    }

    setLoading(true);
    setError('');

    try {
      const response = await fetch(`/api/vehicle/${reg.toUpperCase().replace(/\s/g, '')}`);
      const data = await response.json();

      if (!response.ok) {
        setError(data.error || 'Vehicle not found');
        setVehicleData(null);
      } else {
        setVehicleData(data);
        setError('');
      }
    } catch (error) {
      setError('Error looking up vehicle');
      setVehicleData(null);
    } finally {
      setLoading(false);
    }
  }

  async function addVehicle() {
    setLoading(true);
    const token = localStorage.getItem('glovbox_token');

    try {
      const response = await fetch('/api/user/vehicles', {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${token}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ registrationNumber: reg.toUpperCase().replace(/\s/g, '') })
      });

      if (response.ok) {
        onSuccess();
      } else {
        setError('Failed to add vehicle');
      }
    } catch (error) {
      setError('Error adding vehicle');
    } finally {
      setLoading(false);
    }
  }

  return (
    <div className="fixed inset-0 modal-backdrop flex items-center justify-center z-50 p-4">
      <div className="bg-white rounded-2xl shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto">
        <div className="p-6 md:p-8">
          <div className="flex justify-between items-center mb-6">
            <h2 className="text-2xl font-bold text-blue-900">Add Vehicle</h2>
            <button 
              onClick={onClose}
              className="text-gray-400 hover:text-gray-600 text-3xl leading-none"
            >
              ×
            </button>
          </div>

          <div className="space-y-6">
            <div>
              <label className="block text-sm font-semibold text-gray-700 mb-2">
                Vehicle Registration Number
              </label>
              <div className="flex gap-3">
                <input
                  type="text"
                  value={reg}
                  onChange={(e) => setReg(e.target.value.toUpperCase())}
                  placeholder="e.g. AB12 CDE"
                  maxLength="8"
                  className="flex-1 px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-blue-500 focus:outline-none text-lg font-semibold"
                  onKeyPress={(e) => e.key === 'Enter' && searchVehicle()}
                />
                <button
                  onClick={searchVehicle}
                  disabled={loading}
                  className="bg-blue-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-blue-700 disabled:bg-gray-300"
                >
                  {loading ? 'Searching...' : 'Search'}
                </button>
              </div>
              {error && (
                <p className="text-red-600 text-sm mt-2">⚠️ {error}</p>
              )}
            </div>

            {vehicleData && (
              <div className="bg-green-50 border-2 border-green-200 rounded-lg p-6">
                <h3 className="font-bold text-lg text-green-900 mb-4">✓ Vehicle Found</h3>
                <div className="grid md:grid-cols-2 gap-4 mb-6">
                  <div>
                    <p className="text-sm text-gray-600">Make & Model</p>
                    <p className="font-bold text-lg">{vehicleData.make} {vehicleData.model}</p>
                  </div>
                  <div>
                    <p className="text-sm text-gray-600">Year</p>
                    <p className="font-bold text-lg">{vehicleData.yearOfManufacture}</p>
                  </div>
                  <div>
                    <p className="text-sm text-gray-600">MOT Expires</p>
                    <p className={`font-bold ${vehicleData.motStatus === 'Valid' ? 'text-green-600' : 'text-red-600'}`}>
                      {vehicleData.motExpiryDate || 'N/A'}
                    </p>
                  </div>
                  <div>
                    <p className="text-sm text-gray-600">Tax Due</p>
                    <p className={`font-bold ${vehicleData.taxStatus === 'Taxed' ? 'text-green-600' : 'text-red-600'}`}>
                      {vehicleData.taxDueDate || 'N/A'}
                    </p>
                  </div>
                </div>
                <button
                  onClick={addVehicle}
                  disabled={loading}
                  className="w-full bg-orange-500 text-white py-3 rounded-lg font-bold hover:bg-orange-600 disabled:bg-gray-300"
                >
                  {loading ? 'Adding Vehicle...' : '✓ Add to Dashboard'}
                </button>
              </div>
            )}

            <div className="bg-blue-50 border border-blue-200 rounded-lg p-4 text-sm text-blue-900">
              <strong>💡 Tip:</strong> We'll automatically track your MOT and tax dates and send you email reminders!
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

// Vehicle Overview Component

  return (
    <div className="space-y-6">
      {/* Vehicle Details Card */}
      <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
        <div className="flex justify-between items-center mb-4">
          <h3 className="text-xl font-bold text-blue-900">🚗 Vehicle Details</h3>
          <button
            onClick={onAddVehicle}
            className="text-blue-600 hover:text-blue-700 font-semibold text-sm flex items-center gap-1"
          >
            <span className="text-lg">+</span> Add Another Vehicle

        </div>
        <div className="grid md:grid-cols-3 gap-4">
          <div>
            <p className="text-sm text-gray-600">Registration</p>
            <p className="font-bold text-lg text-blue-900">{vehicle.registrationNumber}</p>
          </div>
          <div>
            <p className="text-sm text-gray-600">Make & Model</p>
            <p className="font-bold text-lg">{vehicle.make} {vehicle.model}</p>
          </div>
          <div>
            <p className="text-sm text-gray-600">Year</p>
            <p className="font-bold text-lg">{vehicle.yearOfManufacture || 'N/A'}</p>
          </div>
          <div>
            <p className="text-sm text-gray-600">Colour</p>
            <p className="font-bold text-lg">{vehicle.colour || 'N/A'}</p>
          </div>
          <div>
            <p className="text-sm text-gray-600">Fuel Type</p>
            <p className="font-bold text-lg">{vehicle.fuelType || 'N/A'}</p>
          </div>
          <div>
            <p className="text-sm text-gray-600">Engine Size</p>
            <p className="font-bold text-lg">{vehicle.engineCapacity ? vehicle.engineCapacity + 'cc' : 'N/A'}</p>

      </div>

      <div className="grid md:grid-cols-2 gap-6">

          <div className="space-y-3">

              <span className={`font-semibold ${vehicle.motStatus === 'Valid' ? 'text-green-600' : 'text-red-600'}`}>
                {vehicle.motStatus || 'Unknown'}
              </span>
            </div>
            <div className="flex justify-between">
              <span className="text-gray-600">Expires:</span>
              <span className="font-semibold">{vehicle.motExpiryDate || 'N/A'}</span>
            </div>
          </div>
          <a 
            href="/mot-search.html"
            className="block w-full mt-4 bg-orange-500 text-white py-2 rounded-lg font-semibold hover:bg-orange-600 text-center"
          >
            Find MOT Centre
          </a>
        </div>

        {/* Tax Card */}
        <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
          <h3 className="text-lg font-bold text-blue-900 mb-4">💷 Road Tax</h3>
          <div className="space-y-3">
            <div className="flex justify-between">
              <span className="text-gray-600">Status:</span>
              <span className={`font-semibold ${vehicle.taxStatus === 'Taxed' ? 'text-green-600' : 'text-red-600'}`}>
                {vehicle.taxStatus || 'Unknown'}
              </span>
            </div>
            <div className="flex justify-between">
              <span className="text-gray-600">Due:</span>
              <span className="font-semibold">{vehicle.taxDueDate || 'N/A'}</span>
            </div>
          </div>
          <a 
            href="https://www.gov.uk/vehicle-tax" 
            target="_blank"
            className="block w-full mt-4 bg-blue-600 text-white py-2 rounded-lg font-semibold hover:bg-blue-700 text-center"
          >
            Pay Tax on GOV.UK
          </a>
        </div>
      </div>

      {/* Available Services */}
      <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
        <h3 className="text-xl font-bold text-blue-900 mb-4">📋 Available Services</h3>
        <div className="grid md:grid-cols-3 gap-4">
          <a 
            href="/mot-search.html"
            className="border-2 border-gray-200 rounded-lg p-4 hover:border-blue-500 hover:shadow-md transition-all"
          >
            <div className="text-3xl mb-2">🔧</div>
            <h4 className="font-bold text-blue-900 mb-1">MOT Finder</h4>
            <p className="text-sm text-gray-600">Find centres with phone numbers</p>
          </a>
          
          <a 
            href="/insurance.html"

          >

            <h4 className="font-bold text-blue-900 mb-1">Insurance</h4>

          <a

          >

            <h4 className="font-bold text-blue-900 mb-1">
              Service Logbook 
              <span className="text-xs bg-green-600 text-white px-2 py-1 rounded ml-2">NEW</span>

      {/* Service Logbook Promo */}
      <div className="bg-gradient-to-r from-blue-600 to-blue-700 rounded-xl shadow-lg p-6 text-white">

        <p className="mb-4 text-blue-100">
          Track all maintenance, upload receipts, and increase your vehicle's resale value
        </p>
        <button 
          onClick={() => window.location.href = '/dashboard.html?view=logbook'}
          className="bg-white text-blue-700 px-6 py-3 rounded-lg font-semibold hover:bg-blue-50"

// Service Logbook Component (same as before)
function ServiceLogbook({ vehicle, user }) {
  const [services, setServices] = useState([]);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    loadServices();
  }, [vehicle.registrationNumber]);

  async function loadServices() {
    try {
      const token = localStorage.getItem('glovbox_token');
      const response = await fetch(`/api/vehicles/${vehicle.registrationNumber}/services`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      const data = await response.json();
      setServices(data.services || []);
    } catch (error) {
      console.error('Error loading services:', error);
    } finally {
      setLoading(false);
    }
  }

  if (loading) {
    return <div className="text-center py-12">Loading service history...</div>;
  }

  return (
    <div className="space-y-6">
      {/* Header */}
      <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
        <h2 className="text-2xl font-bold text-blue-900 mb-2">Service History</h2>
        <p className="text-gray-600">Track all maintenance and increase resale value</p>
      </div>

      {/* Stats */}
      <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
        <div className="bg-blue-50 rounded-lg p-4 text-center">
          <div className="text-3xl font-bold text-blue-900">{services.length}</div>
          <div className="text-sm text-gray-600 mt-1">Services</div>
        </div>
        <div className="bg-green-50 rounded-lg p-4 text-center">
          <div className="text-3xl font-bold text-green-900">
            £{services.reduce((sum, s) => sum + (s.totalCost || 0), 0).toFixed(0)}
          </div>
          <div className="text-sm text-gray-600 mt-1">Total Spent</div>
        </div>
        <div className="bg-purple-50 rounded-lg p-4 text-center">
          <div className="text-3xl font-bold text-purple-900">
            £{services.length > 0 ? (services.reduce((sum, s) => sum + (s.totalCost || 0), 0) / services.length).toFixed(0) : 0}
          </div>
          <div className="text-sm text-gray-600 mt-1">Avg Cost</div>
        </div>
        <div className="bg-orange-50 rounded-lg p-4 text-center">
          <div className="text-3xl font-bold text-orange-900">
            {vehicle.currentMileage ? vehicle.currentMileage.toLocaleString() : '0'}
          </div>
          <div className="text-sm text-gray-600 mt-1">Miles</div>
        </div>
      </div>

      {/* Coming Soon */}
      <div className="bg-blue-50 border-2 border-blue-200 rounded-xl p-6 text-center">
        <div className="text-5xl mb-4">📖</div>
        <h3 className="text-2xl font-bold text-blue-900 mb-2">Service Logbook Coming Soon!</h3>
        <p className="text-blue-700 mb-4">
          We're finalizing the complete interface with photo uploads, OCR scanning, and PDF export
        </p>
        <p className="text-sm text-blue-600">
          For now, you can track your MOT, tax, and get email reminders. Full logbook launching soon! 🚀
        </p>
      </div>
    </div>
  );
}

// Render
ReactDOM.render(<Dashboard />, document.getElementById('root'));
</script>
</body>
</html>

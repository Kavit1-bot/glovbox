<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Glovbox</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">

<nav class="bg-white border-b sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
    <div class="flex items-center gap-4">
      <div class="flex items-center gap-2">
        <span class="text-3xl">🚗</span>
        <span class="text-2xl font-bold text-blue-900">Glovbox</span>
      </div>
      <span id="userName" class="text-gray-600"></span>
    </div>
    <div class="flex items-center gap-4">
      <div class="relative">
        <button class="text-2xl relative">🔔</button>
        <span id="notifBadge" class="hidden absolute -top-1 -right-1 bg-red-500 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center"></span>
      </div>
      <a href="/my-account.html" class="text-gray-700 hover:text-blue-900">⚙️</a>
      <button onclick="signOut()" class="text-gray-700 hover:text-blue-900">Sign Out</button>
    </div>
  </div>
</nav>

<div id="aiInsights" class="hidden bg-gradient-to-r from-blue-600 to-blue-700 text-white">
  <div class="max-w-7xl mx-auto px-6 py-6">
    <div id="aiContent"></div>
  </div>
</div>

<div class="max-w-7xl mx-auto px-6 py-8">
  <div class="flex gap-6">
    
    <div class="flex-1">
      <div class="flex justify-between items-center mb-6">
        <h1 class="text-3xl font-bold text-gray-900">My Vehicles</h1>
        <button onclick="showAddVehicle()" class="bg-orange-500 text-white px-6 py-3 rounded-lg font-bold hover:bg-orange-600">
          + Add Vehicle
        </button>
      </div>

      <div id="vehiclesList" class="space-y-4"></div>

      <div id="addVehicleForm" class="hidden bg-white rounded-xl shadow-sm border p-6 mb-6">
        <h3 class="text-lg font-bold mb-4">Add Vehicle</h3>
        <input type="text" id="regInput" placeholder="Registration (e.g. AB12CDE)" class="w-full px-4 py-3 border-2 rounded-lg mb-4" />
        <p id="addError" class="text-red-600 text-sm mb-4 hidden"></p>
        <div class="flex gap-3">
          <button onclick="addVehicle()" id="addBtn" class="bg-blue-600 text-white px-6 py-2 rounded-lg font-semibold hover:bg-blue-700">Add</button>
          <button onclick="hideAddVehicle()" class="bg-gray-200 text-gray-700 px-6 py-2 rounded-lg font-semibold hover:bg-gray-300">Cancel</button>
        </div>
      </div>
    </div>

    <div class="w-80 space-y-6">
      
      <div id="healthScoreCard" class="hidden bg-white rounded-xl shadow-sm border p-6">
        <h3 class="text-lg font-bold text-gray-900 mb-4">Vehicle Health</h3>
        <div class="text-center mb-4">
          <div id="healthScore" class="text-5xl font-bold mb-2">--</div>
          <div id="healthGrade" class="text-xl font-semibold text-gray-600"></div>
        </div>
        <div id="healthIssues" class="text-sm space-y-2"></div>
      </div>

      <div class="bg-white rounded-xl shadow-sm border p-6">
        <h3 class="text-lg font-bold text-blue-900 mb-4">This Month</h3>
        <div class="text-3xl font-bold text-gray-900 mb-2">Spent: <span id="monthlyTotal">£0</span></div>
        <div class="bg-gray-200 rounded-full h-2 mb-3">
          <div id="budgetBar" class="bg-orange-500 h-2 rounded-full" style="width:0%"></div>
        </div>
        <div id="costBreakdown" class="space-y-1 text-sm"></div>
      </div>

      <div class="bg-white rounded-xl shadow-sm border p-6">
        <h3 class="text-lg font-bold text-blue-900 mb-4">Quick Actions</h3>
        <div class="space-y-2">
          <button onclick="window.location.href='/service-logbook.html'" class="w-full flex items-center gap-3 p-3 hover:bg-blue-50 rounded-lg text-left">
            <span class="text-2xl">📖</span>
            <div><div class="font-semibold text-sm">Service Logbook</div></div>
          </button>
          <button onclick="window.location.href='/mot-search.html'" class="w-full flex items-center gap-3 p-3 hover:bg-blue-50 rounded-lg text-left">
            <span class="text-2xl">🔧</span>
            <div><div class="font-semibold text-sm">Book MOT</div></div>
          </button>
          <button onclick="window.open('https://www.gov.uk/vehicle-tax', '_blank')" class="w-full flex items-center gap-3 p-3 hover:bg-blue-50 rounded-lg text-left">
            <span class="text-2xl">💷</span>
            <div><div class="font-semibold text-sm">Pay Road Tax</div></div>
          </button>
          <button onclick="window.location.href='/insurance.html'" class="w-full flex items-center gap-3 p-3 hover:bg-blue-50 rounded-lg text-left">
            <span class="text-2xl">💰</span>
            <div><div class="font-semibold text-sm">Compare Insurance</div></div>
          </button>
          <button onclick="window.location.href='/breakdown.html'" class="w-full flex items-center gap-3 p-3 hover:bg-blue-50 rounded-lg text-left">
            <span class="text-2xl">🚗</span>
            <div><div class="font-semibold text-sm">Breakdown Cover</div></div>
          </button>
          <button onclick="exportPDF()" class="w-full flex items-center gap-3 p-3 hover:bg-blue-50 rounded-lg text-left">
            <span class="text-2xl">📄</span>
            <div><div class="font-semibold text-sm">Export PDF</div></div>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const token = sessionStorage.getItem('glovbox_token');
const user = JSON.parse(sessionStorage.getItem('glovbox_user') || '{}');

if (!token) {
  window.location.href = '/signin.html';
}

document.getElementById('userName').textContent = `Hi, ${user.name || 'User'}`;

let currentVehicle = null;

async function loadVehicles() {
  try {
    const response = await fetch('/api/user/vehicles', {
      headers: {'Authorization': `Bearer ${token}`}
    });
    const data = await response.json();
    
    if (data.vehicles && data.vehicles.length > 0) {
      currentVehicle = data.vehicles[0];
      displayVehicles(data.vehicles);
      loadHealthScore();
      loadAIInsights();
      loadMonthlyCosts();
      loadNotifications();
    } else {
      document.getElementById('vehiclesList').innerHTML = '<div class="bg-white rounded-xl p-8 text-center"><p class="text-gray-600">No vehicles added yet. Click "Add Vehicle" to get started!</p></div>';
    }
  } catch (error) {
    console.error('Load error:', error);
  }
}

function displayVehicles(vehicles) {
  const html = vehicles.map(v => `
    <div class="bg-white rounded-xl shadow-sm border p-6 hover:shadow-md transition">
      <div class="flex justify-between items-start mb-4">
        <div>
          <h3 class="text-2xl font-bold text-blue-900">${v.make} ${v.model}</h3>
          <p class="text-gray-600">${v.registrationNumber}</p>
        </div>
        <button onclick="deleteVehicle('${v.registrationNumber}')" class="text-red-600 hover:text-red-800">🗑️</button>
      </div>
      <div class="grid grid-cols-2 gap-4 text-sm">
        <div><span class="text-gray-600">Year:</span> <span class="font-semibold">${v.yearOfManufacture}</span></div>
        <div><span class="text-gray-600">Fuel:</span> <span class="font-semibold">${v.fuelType}</span></div>
        <div><span class="text-gray-600">MOT:</span> <span class="font-semibold ${v.motStatus === 'Valid' ? 'text-green-600' : 'text-red-600'}">${v.motExpiryDate || 'N/A'}</span></div>
        <div><span class="text-gray-600">Tax:</span> <span class="font-semibold ${v.taxStatus === 'Taxed' ? 'text-green-600' : 'text-red-600'}">${v.taxDueDate || 'N/A'}</span></div>
      </div>
    </div>
  `).join('');
  document.getElementById('vehiclesList').innerHTML = html;
}

function showAddVehicle() {
  document.getElementById('addVehicleForm').classList.remove('hidden');
  document.getElementById('regInput').focus();
}

function hideAddVehicle() {
  document.getElementById('addVehicleForm').classList.add('hidden');
  document.getElementById('regInput').value = '';
  document.getElementById('addError').classList.add('hidden');
}

async function addVehicle() {
  const reg = document.getElementById('regInput').value.trim().toUpperCase();
  const error = document.getElementById('addError');
  const btn = document.getElementById('addBtn');
  
  if (!reg) {
    error.textContent = 'Enter registration';
    error.classList.remove('hidden');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Adding...';
  error.classList.add('hidden');

  try {
    const response = await fetch('/api/user/vehicles', {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${token}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({registrationNumber: reg})
    });

    if (response.ok) {
      hideAddVehicle();
      loadVehicles();
    } else {
      const data = await response.json();
      error.textContent = data.error || 'Failed to add vehicle';
      error.classList.remove('hidden');
    }
  } catch (err) {
    error.textContent = 'Network error';
    error.classList.remove('hidden');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Add';
  }
}

async function deleteVehicle(reg) {
  if (!confirm('Delete this vehicle?')) return;
  
  try {
    await fetch(`/api/user/vehicles/${reg}`, {
      method: 'DELETE',
      headers: {'Authorization': `Bearer ${token}`}
    });
    loadVehicles();
  } catch {}
}

async function loadHealthScore() {
  if (!currentVehicle) return;
  
  try {
    const response = await fetch(`/api/vehicle/${currentVehicle.registrationNumber}/health-score`, {
      headers: {'Authorization': `Bearer ${token}`}
    });
    
    if (response.ok) {
      const data = await response.json();
      document.getElementById('healthScoreCard').classList.remove('hidden');
      document.getElementById('healthScore').textContent = data.score;
      document.getElementById('healthScore').className = `text-5xl font-bold mb-2 ${data.score > 80 ? 'text-green-600' : data.score > 60 ? 'text-yellow-600' : 'text-red-600'}`;
      document.getElementById('healthGrade').textContent = `Grade ${data.grade}`;
      
      const issuesHTML = data.issues.length > 0 
        ? data.issues.map(i => `<div class="text-red-600">⚠️ ${i}</div>`).join('')
        : '<div class="text-green-600">✓ All good!</div>';
      document.getElementById('healthIssues').innerHTML = issuesHTML;
    }
  } catch {}
}

async function loadAIInsights() {
  try {
    const response = await fetch('/api/ai/insights', {
      headers: {'Authorization': `Bearer ${token}`}
    });
    const data = await response.json();
    
    if (data.opportunities && data.opportunities.length > 0) {
      const opp = data.opportunities[0];
      document.getElementById('aiInsights').classList.remove('hidden');
      document.getElementById('aiContent').innerHTML = `
        <h3 class="text-xl font-bold mb-2">${opp.title}</h3>
        <p class="mb-4">${opp.message}</p>
        ${opp.potentialSaving > 0 ? `<p class="text-lg font-bold mb-4">💰 Save £${opp.potentialSaving}</p>` : ''}
        <button onclick="window.location.href='${opp.action}'" class="bg-white text-blue-600 px-6 py-3 rounded-lg font-bold hover:bg-blue-50">Take Action</button>
      `;
    }
  } catch {}
}

async function loadMonthlyCosts() {
  const month = new Date().toISOString().slice(0, 7);
  
  try {
    const response = await fetch(`/api/user/costs?month=${month}`, {
      headers: {'Authorization': `Bearer ${token}`}
    });
    
    if (!response.ok) {
      document.getElementById('monthlyTotal').textContent = '£0';
      return;
    }
    
    const data = await response.json();
    const total = data.total || 0;
    document.getElementById('monthlyTotal').textContent = `£${total.toFixed(0)}`;
    const percentUsed = data.percentUsed || 0;
    document.getElementById('budgetBar').style.width = `${Math.min(percentUsed, 100)}%`;
    
    if (data.breakdown && Object.keys(data.breakdown).length > 0) {
      const breakdownHTML = Object.entries(data.breakdown).map(([cat, amount]) => `
        <div class="flex justify-between">
          <span class="text-gray-600 capitalize">${cat}</span>
          <span class="font-semibold">£${Number(amount).toFixed(0)}</span>
        </div>
      `).join('');
      document.getElementById('costBreakdown').innerHTML = breakdownHTML;
    } else {
      document.getElementById('costBreakdown').innerHTML = '<p class="text-gray-500 text-sm">No expenses</p>';
    }
  } catch {}
}

async function loadNotifications() {
  try {
    const response = await fetch('/api/notifications', {
      headers: {'Authorization': `Bearer ${token}`}
    });
    const data = await response.json();
    
    if (data.unread > 0) {
      document.getElementById('notifBadge').textContent = data.unread;
      document.getElementById('notifBadge').classList.remove('hidden');
    }
  } catch {}
}

function exportPDF() {
  if (!currentVehicle) {
    alert('Please add a vehicle first');
    return;
  }
  
  const form = document.createElement('form');
  form.method = 'GET';
  form.action = `/api/documents/export-pdf/${currentVehicle.registrationNumber}`;
  form.target = '_blank';
  
  const tokenInput = document.createElement('input');
  tokenInput.type = 'hidden';
  tokenInput.name = 'token';
  tokenInput.value = token;
  form.appendChild(tokenInput);
  
  document.body.appendChild(form);
  form.submit();
  document.body.removeChild(form);
}

function signOut() {
  sessionStorage.clear();
  window.location.href = '/signin.html';
}

loadVehicles();
</script>

</body>
</html>

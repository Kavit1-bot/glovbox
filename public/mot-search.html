<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOT Centre Finder - Glovbox</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Inter',sans-serif;background:#F8FAFC;color:#1E293B}nav{background:white;border-bottom:1px solid #E2E8F0;padding:12px 20px;display:flex;justify-content:space-between;align-items:center}.logo{font-weight:700;font-size:18px;color:#0B3D91;text-decoration:none}.back-link{color:#0B3D91;text-decoration:none;font-size:14px;font-weight:600}.container{max-width:800px;margin:40px auto;padding:0 20px}h1{font-size:32px;color:#0B3D91;margin-bottom:8px;text-align:center}.subtitle{text-align:center;color:#64748B;margin-bottom:32px;font-size:15px}.card{background:white;border:1px solid #E2E8F0;border-radius:12px;padding:24px;margin-bottom:20px;box-shadow:0 2px 8px rgba(11,61,145,0.06)}.input-group{margin-bottom:16px}label{display:block;font-weight:600;color:#0B3D91;margin-bottom:8px;font-size:14px}input{width:100%;padding:14px;border:2px solid #E2E8F0;border-radius:8px;font-size:15px}input:focus{outline:none;border-color:#0B3D91}.btn-search{background:#FF6B35;color:white;padding:16px;border-radius:8px;border:none;font-weight:700;font-size:15px;cursor:pointer;width:100%}.btn-search:hover{background:#E85A2A}.btn-search:disabled{background:#CBD5E1;cursor:not-allowed}.loading{text-align:center;padding:40px;display:none}.spinner{border:3px solid #E2E8F0;border-top:3px solid:#0B3D91;border-radius:50%;width:40px;height:40px;animation:spin 0.8s linear infinite;margin:0 auto 16px}@keyframes spin{to{transform:rotate(360deg)}}.error{background:#FEF2F2;color:#DC2626;padding:14px;border-radius:8px;margin-bottom:16px;border:1px solid #FEE2E2;display:none}.centre{background:white;border:2px solid #E2E8F0;padding:20px;border-radius:10px;margin-bottom:16px;transition:all 0.2s}.centre:hover{border-color:#0B3D91;box-shadow:0 4px 12px rgba(11,61,145,0.1)}.centre h3{color:#0B3D91;font-size:18px;margin-bottom:10px}.centre-info{color:#64748B;font-size:14px;margin-bottom:8px}.centre-rating{color:#10B981;font-weight:600}.open{color:#10B981;font-weight:600}.closed{color:#DC2626;font-weight:600}.phone{color:#0B3D91;font-weight:600;text-decoration:none}.phone:hover{text-decoration:underline}.no-results{text-align:center;padding:40px;color:#64748B;font-size:16px}details{margin-top:12px}summary{cursor:pointer;color:#0B3D91;font-weight:600;font-size:14px;padding:8px 0}summary:hover{text-decoration:underline}.hours-list{margin-top:10px;padding-left:0;list-style:none}.hours-list li{color:#64748B;font-size:13px;margin-bottom:4px;padding:4px 0}.results-header{color:#0B3D91;margin-bottom:20px;font-size:20px;font-weight:700}
</style>
</head>
<body>

<nav>
<a href="/" class="logo">Glovbox</a>
<a href="/dashboard.html" class="back-link">← Back to Dashboard</a>
</nav>

<div class="container">
<h1>🔧 Find MOT Centres</h1>
<p class="subtitle">Search for MOT testing centres with phone numbers and opening hours</p>

<div class="card">
<div class="input-group">
<label for="postcode">Enter Your Postcode</label>
<input type="text" id="postcode" placeholder="e.g. SW1A 1AA" maxlength="10">
</div>
<button class="btn-search" id="searchBtn" onclick="searchCentres()">Search MOT Centres</button>
</div>

<div id="error" class="error"></div>
<div id="loading" class="loading">
<div class="spinner"></div>
<p style="color:#64748B">Searching for MOT centres...</p>
</div>

<div id="results"></div>
</div>

<script>
async function searchCentres() {
  const postcode = document.getElementById('postcode').value.trim().toUpperCase();
  const errorDiv = document.getElementById('error');
  const loadingDiv = document.getElementById('loading');
  const resultsDiv = document.getElementById('results');
  const searchBtn = document.getElementById('searchBtn');
  
  // Clear previous results
  errorDiv.style.display = 'none';
  resultsDiv.innerHTML = '';
  
  // Validate postcode
  if (!postcode) {
    errorDiv.textContent = 'Please enter a postcode';
    errorDiv.style.display = 'block';
    return;
  }
  
  // Get token
  const token = localStorage.getItem('token');
  console.log('Token found:', token ? 'YES (length: ' + token.length + ')' : 'NO');
  
  if (!token) {
    errorDiv.textContent = 'Please sign in to use MOT search. Redirecting...';
    errorDiv.style.display = 'block';
    setTimeout(() => {
      window.location.href = '/signin.html?redirect=/mot-search.html';
    }, 2000);
    return;
  }
  
  // Show loading
  loadingDiv.style.display = 'block';
  searchBtn.disabled = true;
  searchBtn.textContent = 'Searching...';
  
  try {
    // Step 1: Geocode postcode
    console.log('🔍 Step 1: Geocoding postcode:', postcode);
    console.log('📤 Sending request to: /api/geocode?postcode=' + postcode);
    console.log('🔑 Authorization header: Bearer ' + token.substring(0, 20) + '...');
    
    const geocodeResponse = await fetch('/api/geocode?postcode=' + encodeURIComponent(postcode), {
      method: 'GET',
      headers: {
        'Authorization': 'Bearer ' + token,
        'Content-Type': 'application/json'
      }
    });
    
    console.log('📥 Geocode response status:', geocodeResponse.status);
    
    if (geocodeResponse.status === 401) {
      throw new Error('Not authenticated. Please sign in again.');
    }
    
    if (geocodeResponse.status === 403) {
      throw new Error('Session expired. Please sign in again.');
    }
    
    if (!geocodeResponse.ok) {
      const errorData = await geocodeResponse.json();
      console.error('❌ Geocode error:', errorData);
      throw new Error(errorData.error || 'Invalid postcode or location not found');
    }
    
    const location = await geocodeResponse.json();
    console.log('✅ Location found:', location);
    
    // Step 2: Search for MOT centres
    console.log('🔍 Step 2: Searching for MOT centres...');
    console.log('📤 Sending request to: /api/mot-centres?lat=' + location.lat + '&lng=' + location.lng);
    
    const centresResponse = await fetch('/api/mot-centres?lat=' + location.lat + '&lng=' + location.lng, {
      method: 'GET',
      headers: {
        'Authorization': 'Bearer ' + token,
        'Content-Type': 'application/json'
      }
    });
    
    console.log('📥 MOT centres response status:', centresResponse.status);
    
    if (centresResponse.status === 401 || centresResponse.status === 403) {
      throw new Error('Session expired. Please sign in again.');
    }
    
    if (!centresResponse.ok) {
      const errorData = await centresResponse.json();
      console.error('❌ MOT centres error:', errorData);
      throw new Error(errorData.error || 'Failed to find MOT centres');
    }
    
    const data = await centresResponse.json();
    console.log('✅ Found', data.centres?.length || 0, 'centres');
    
    // Hide loading
    loadingDiv.style.display = 'none';
    searchBtn.disabled = false;
    searchBtn.textContent = 'Search MOT Centres';
    
    // Show results
    if (!data.centres || data.centres.length === 0) {
      resultsDiv.innerHTML = '<div class="no-results">😕 No MOT centres found near this postcode.<br>Try a different location.</div>';
      return;
    }
    
    resultsDiv.innerHTML = '<h2 class="results-header">✅ Found ' + data.centres.length + ' MOT Centre' + (data.centres.length > 1 ? 's' : '') + ' Near ' + postcode + '</h2>';
    
    data.centres.forEach((centre, index) => {
      console.log('Centre ' + (index + 1) + ':', centre.name);
      
      const centreDiv = document.createElement('div');
      centreDiv.className = 'centre';
      
      let html = '<h3>' + centre.name + '</h3>';
      html += '<div class="centre-info">📍 ' + centre.address + '</div>';
      
      if (centre.rating && centre.rating !== 'N/A') {
        html += '<div class="centre-info">⭐ Rating: <span class="centre-rating">' + centre.rating + '/5</span></div>';
      }
      
      if (centre.phone) {
        html += '<div class="centre-info">📞 <a href="tel:' + centre.phone + '" class="phone">' + centre.phone + '</a> - Click to call</div>';
      }
      
      if (centre.isOpenNow !== undefined) {
        html += '<div class="centre-info">🕐 <span class="' + (centre.isOpenNow ? 'open' : 'closed') + '">' + (centre.isOpenNow ? 'Open Now' : 'Currently Closed') + '</span></div>';
      }
      
      if (centre.hours && centre.hours.length > 0) {
        html += '<details><summary>📅 View Opening Hours</summary><ul class="hours-list">';
        centre.hours.forEach(day => {
          html += '<li>' + day + '</li>';
        });
        html += '</ul></details>';
      }
      
      centreDiv.innerHTML = html;
      resultsDiv.appendChild(centreDiv);
    });
    
    console.log('🎉 MOT search completed successfully!');
    
  } catch (error) {
    console.error('❌ Error:', error);
    loadingDiv.style.display = 'none';
    searchBtn.disabled = false;
    searchBtn.textContent = 'Search MOT Centres';
    
    if (error.message.includes('sign in') || error.message.includes('Session') || error.message.includes('authenticated')) {
      errorDiv.textContent = error.message + ' Redirecting...';
      errorDiv.style.display = 'block';
      setTimeout(() => {
        window.location.href = '/signin.html?redirect=/mot-search.html';
      }, 2000);
    } else {
      errorDiv.textContent = '❌ ' + error.message;
      errorDiv.style.display = 'block';
    }
  }
}

// Enter key to search
document.getElementById('postcode').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') {
    searchCentres();
  }
});

// Show token status on page load (for debugging)
window.addEventListener('DOMContentLoaded', function() {
  const token = localStorage.getItem('token');
  console.log('=================================');
  console.log('MOT Search Page Loaded');
  console.log('Token present:', token ? 'YES' : 'NO');
  if (token) {
    console.log('Token preview:', token.substring(0, 30) + '...');
  }
  console.log('=================================');
});
</script>

</body>
</html>

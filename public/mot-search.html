<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOT Centre Search - Glovbox</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">

<nav class="bg-white border-b sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
    <div class="flex items-center gap-2">
      <span class="text-3xl">🚗</span>
      <span class="text-2xl font-bold text-blue-900">Glovbox</span>
    </div>
    <a href="/dashboard.html" class="text-gray-700 hover:text-blue-900 font-semibold">← Back to Dashboard</a>
  </div>
</nav>

<div class="max-w-4xl mx-auto px-6 py-12">
  
  <div class="text-center mb-12">
    <h1 class="text-4xl font-bold text-blue-900 mb-4">🔧 Find MOT Centres</h1>
    <p class="text-xl text-gray-600">Search for MOT testing centres near you</p>
  </div>

  <!-- Search Box -->
  <div class="bg-white rounded-2xl shadow-lg p-8 mb-8">
    <label class="block text-lg font-bold text-gray-900 mb-4">Enter Your Postcode</label>
    <div class="flex gap-4">
      <input 
        type="text" 
        id="postcodeInput" 
        placeholder="e.g. SW1A 1AA" 
        class="flex-1 px-6 py-4 border-2 border-gray-300 rounded-xl focus:border-blue-500 focus:outline-none text-lg uppercase"
        onkeypress="if(event.key==='Enter') searchCentres()"
      />
      <button 
        onclick="searchCentres()" 
        id="searchBtn"
        class="bg-orange-500 text-white px-8 py-4 rounded-xl font-bold text-lg hover:bg-orange-600"
      >
        Search
      </button>
    </div>
    <p id="searchError" class="text-red-600 mt-3 hidden"></p>
  </div>

  <!-- Loading -->
  <div id="loading" class="hidden text-center py-12">
    <div class="animate-spin w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full mx-auto mb-4"></div>
    <p class="text-gray-600">Finding MOT centres near you...</p>
  </div>

  <!-- Results -->
  <div id="results" class="hidden">
    <h2 class="text-2xl font-bold text-gray-900 mb-6">MOT Centres Near You</h2>
    <div id="centresList" class="space-y-4"></div>
  </div>

  <!-- No Results -->
  <div id="noResults" class="hidden text-center py-12">
    <div class="text-6xl mb-4">🔍</div>
    <h3 class="text-2xl font-bold text-gray-700 mb-2">No centres found</h3>
    <p class="text-gray-600">Try a different postcode</p>
  </div>

</div>

<script>
async function searchCentres() {
  const postcode = document.getElementById('postcodeInput').value.trim();
  
  if (!postcode) {
    document.getElementById('searchError').textContent = 'Please enter a postcode';
    document.getElementById('searchError').classList.remove('hidden');
    return;
  }

  // Hide previous results
  document.getElementById('results').classList.add('hidden');
  document.getElementById('noResults').classList.add('hidden');
  document.getElementById('searchError').classList.add('hidden');
  
  // Show loading
  document.getElementById('loading').classList.remove('hidden');
  document.getElementById('searchBtn').textContent = 'Searching...';
  document.getElementById('searchBtn').disabled = true;

  try {
    const response = await fetch(`/api/mot-centres?postcode=${encodeURIComponent(postcode)}`);
    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || 'Search failed');
    }

    document.getElementById('loading').classList.add('hidden');

    if (data.centres && data.centres.length > 0) {
      displayResults(data.centres);
    } else {
      document.getElementById('noResults').classList.remove('hidden');
    }
  } catch (error) {
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('searchError').textContent = error.message;
    document.getElementById('searchError').classList.remove('hidden');
  } finally {
    document.getElementById('searchBtn').textContent = 'Search';
    document.getElementById('searchBtn').disabled = false;
  }
}

function displayResults(centres) {
  const html = centres.map((centre, index) => `
    <div class="bg-white rounded-xl p-6 shadow-md hover:shadow-lg transition">
      <div class="flex items-start justify-between mb-3">
        <div class="flex-1">
          <h3 class="text-xl font-bold text-blue-900 mb-1">${centre.name}</h3>
          <p class="text-gray-600">${centre.address}</p>
        </div>
        ${centre.rating !== 'N/A' ? `<div class="flex items-center gap-1 bg-green-100 px-3 py-1 rounded-full">
          <span class="text-yellow-500">⭐</span>
          <span class="font-bold text-green-700">${centre.rating}</span>
        </div>` : ''}
      </div>
      <div class="flex items-center gap-4 text-sm">
        ${centre.isOpenNow ? 
          '<span class="text-green-600 font-semibold">✓ Open Now</span>' : 
          '<span class="text-gray-500">• Currently Closed</span>'
        }
      </div>
      <button 
        onclick="bookMOT('${centre.name}')" 
        class="mt-4 w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700"
      >
        Contact Centre
      </button>
    </div>
  `).join('');

  document.getElementById('centresList').innerHTML = html;
  document.getElementById('results').classList.remove('hidden');
}

function bookMOT(centreName) {
  alert(`Call ${centreName} to book your MOT appointment`);
}
</script>

</body>
</html>

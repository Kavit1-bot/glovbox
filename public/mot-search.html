<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOT Centre Finder - Glovbox</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Inter',sans-serif;background:#F8FAFC;color:#1E293B}nav{background:white;border-bottom:1px solid #E2E8F0;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}.logo{font-weight:700;font-size:18px;color:#0B3D91;text-decoration:none}.back-link{color:#0B3D91;text-decoration:none;font-size:14px;font-weight:600}.back-link:hover{text-decoration:underline}.container{max-width:800px;margin:40px auto;padding:0 20px}h1{font-size:32px;color:#0B3D91;margin-bottom:8px;text-align:center}.subtitle{text-align:center;color:#64748B;margin-bottom:32px;font-size:15px}.card{background:white;border:1px solid #E2E8F0;border-radius:12px;padding:24px;margin-bottom:20px;box-shadow:0 2px 8px rgba(11,61,145,0.06)}.input-group{margin-bottom:16px}label{display:block;font-weight:600;color:#0B3D91;margin-bottom:8px;font-size:14px}input{width:100%;padding:14px;border:2px solid #E2E8F0;border-radius:8px;font-size:15px}input:focus{outline:none;border-color:#0B3D91}.btn-search{background:#FF6B35;color:white;padding:16px;border-radius:8px;border:none;font-weight:700;font-size:15px;cursor:pointer;width:100%}.btn-search:hover{background:#E85A2A}.btn-search:disabled{background:#CBD5E1;cursor:not-allowed}.loading{text-align:center;padding:40px;display:none}.spinner{border:3px solid #E2E8F0;border-top:3px solid:#0B3D91;border-radius:50%;width:40px;height:40px;animation:spin 0.8s linear infinite;margin:0 auto 16px}@keyframes spin{to{transform:rotate(360deg)}}.error{background:#FEF2F2;color:#DC2626;padding:14px;border-radius:8px;margin-bottom:16px;border:1px solid #FEE2E2;display:none}.centre{background:white;border:2px solid #E2E8F0;padding:20px;border-radius:10px;margin-bottom:16px}.centre:hover{border-color:#0B3D91;box-shadow:0 4px 12px rgba(11,61,145,0.1)}.centre h3{color:#0B3D91;font-size:18px;margin-bottom:10px}.centre-info{color:#64748B;font-size:14px;margin-bottom:8px}.centre-rating{color:#10B981;font-weight:600}.open{color:#10B981;font-weight:600}.closed{color:#DC2626;font-weight:600}.phone{color:#0B3D91;font-weight:600;text-decoration:none}.phone:hover{text-decoration:underline}.no-results{text-align:center;padding:40px;color:#64748B;font-size:16px}details{margin-top:12px}summary{cursor:pointer;color:#0B3D91;font-weight:600;font-size:14px;padding:8px 0}.hours-list{margin-top:10px;padding-left:0;list-style:none}.hours-list li{color:#64748B;font-size:13px;margin-bottom:4px;padding:4px 0}.results-header{color:#0B3D91;margin-bottom:20px;font-size:20px;font-weight:700}
</style>
</head>
<body>

<nav>
<a href="/" class="logo">Glovbox</a>
<a href="/dashboard.html" class="back-link">← Back to Dashboard</a>
</nav>

<div class="container">
<h1>🔧 Find MOT Centres</h1>
<p class="subtitle">Search for MOT testing centres with phone numbers and opening hours</p>

<div class="card">
<div class="input-group">
<label for="postcode">Enter Your Postcode</label>
<input type="text" id="postcode" placeholder="e.g. SW1A 1AA" maxlength="10">
</div>
<button class="btn-search" id="searchBtn" onclick="searchCentres()">Search MOT Centres</button>
</div>

<div id="error" class="error"></div>
<div id="loading" class="loading"><div class="spinner"></div><p style="color:#64748B">Searching...</p></div>
<div id="results"></div>
</div>

<script>
window.addEventListener('DOMContentLoaded',function(){const t=localStorage.getItem('token');if(!t){document.getElementById('error').textContent='Please sign in to use MOT search';document.getElementById('error').style.display='block';setTimeout(()=>window.location.href='/signin.html?redirect=/mot-search.html',2000)}});async function searchCentres(){const p=document.getElementById('postcode').value.trim().toUpperCase(),e=document.getElementById('error'),l=document.getElementById('loading'),r=document.getElementById('results'),b=document.getElementById('searchBtn');e.style.display='none';r.innerHTML='';if(!p){e.textContent='Please enter a postcode';e.style.display='block';return}const t=localStorage.getItem('token');if(!t){e.textContent='Session expired. Redirecting...';e.style.display='block';setTimeout(()=>window.location.href='/signin.html?redirect=/mot-search.html',2000);return}l.style.display='block';b.disabled=true;b.textContent='Searching...';try{const g=await fetch('/api/geocode?postcode='+encodeURIComponent(p),{headers:{'Authorization':'Bearer '+t}});if(g.status===401||g.status===403){throw new Error('Session expired')}if(!g.ok){const err=await g.json();throw new Error(err.error||'Invalid postcode')}const loc=await g.json();const c=await fetch(`/api/mot-centres?lat=${loc.lat}&lng=${loc.lng}`,{headers:{'Authorization':'Bearer '+t}});if(!c.ok){throw new Error('Failed to find centres')}const d=await c.json();l.style.display='none';b.disabled=false;b.textContent='Search MOT Centres';if(!d.centres||d.centres.length===0){r.innerHTML='<div class="no-results">No MOT centres found near this postcode</div>';return}r.innerHTML='<h2 class="results-header">Found '+d.centres.length+' MOT Centre'+(d.centres.length>1?'s':'')+' Near '+p+'</h2>';d.centres.forEach(c=>{const div=document.createElement('div');div.className='centre';let h=`<h3>${c.name}</h3><div class="centre-info">📍 ${c.address}</div>`;if(c.rating&&c.rating!=='N/A')h+=`<div class="centre-info">⭐ <span class="centre-rating">${c.rating}/5</span></div>`;if(c.phone)h+=`<div class="centre-info">📞 <a href="tel:${c.phone}" class="phone">${c.phone}</a></div>`;if(c.isOpenNow!==undefined)h+=`<div class="centre-info">🕐 <span class="${c.isOpenNow?'open':'closed'}">${c.isOpenNow?'Open Now':'Closed'}</span></div>`;if(c.hours&&c.hours.length>0){h+='<details><summary>Opening Hours</summary><ul class="hours-list">';c.hours.forEach(d=>h+=`<li>${d}</li>`);h+='</ul></details>'}div.innerHTML=h;r.appendChild(div)})}catch(err){l.style.display='none';b.disabled=false;b.textContent='Search MOT Centres';if(err.message.includes('Session')){e.textContent=err.message+'. Redirecting...';e.style.display='block';setTimeout(()=>window.location.href='/signin.html?redirect=/mot-search.html',2000)}else{e.textContent=err.message;e.style.display='block'}}}document.getElementById('postcode').addEventListener('keypress',e=>{if(e.key==='Enter')searchCentres()});
</script>
</body>
</html>

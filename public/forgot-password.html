<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password - Glovbox</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">

<div class="min-h-screen flex items-center justify-center px-4">
  <div class="max-w-md w-full">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-blue-900 mb-2">🚗 Glovbox</h1>
      <h2 class="text-2xl font-bold text-gray-900">Reset Password</h2>
    </div>

    <!-- Form -->
    <div id="form" class="bg-white rounded-2xl shadow-lg p-8">
      <p class="text-gray-600 mb-6">Enter your email address and we'll send you a link to reset your password.</p>
      
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Email Address</label>
          <input
            type="email"
            id="email"
            placeholder="you@example.com"
            class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-blue-500 focus:outline-none"
            onkeypress="if(event.key==='Enter') sendReset()"
          />
        </div>

        <p id="error" class="text-red-600 text-sm hidden"></p>

        <button
          onclick="sendReset()"
          id="submitBtn"
          class="w-full bg-orange-500 text-white py-3 rounded-lg font-bold hover:bg-orange-600"
        >
          Send Reset Link
        </button>

        <div class="text-center">
          <a href="/signin.html" class="text-blue-600 hover:underline text-sm">Back to Sign In</a>
        </div>
      </div>
    </div>

    <!-- Success -->
    <div id="success" class="hidden bg-white rounded-2xl shadow-lg p-8 text-center">
      <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
        <svg class="w-8 h-8 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
        </svg>
      </div>
      <h3 class="text-xl font-bold text-gray-900 mb-2">Check Your Email</h3>
      <p class="text-gray-600 mb-6">If an account exists with that email, we've sent a password reset link.</p>
      <a href="/signin.html" class="text-blue-600 hover:underline">Back to Sign In</a>
    </div>
  </div>
</div>

<script>
async function sendReset() {
  const email = document.getElementById('email').value.trim();
  const errorEl = document.getElementById('error');
  const submitBtn = document.getElementById('submitBtn');

  errorEl.classList.add('hidden');

  if (!email) {
    errorEl.textContent = 'Please enter your email';
    errorEl.classList.remove('hidden');
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = 'Sending...';

  try {
    const response = await fetch('/api/forgot-password', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({email})
    });

    const data = await response.json();

    if (response.ok) {
      document.getElementById('form').classList.add('hidden');
      document.getElementById('success').classList.remove('hidden');
    } else {
      errorEl.textContent = data.error || 'Failed to send reset link';
      errorEl.classList.remove('hidden');
    }
  } catch (error) {
    errorEl.textContent = 'Network error. Please try again.';
    errorEl.classList.remove('hidden');
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Send Reset Link';
  }
}
</script>

</body>
</html>
